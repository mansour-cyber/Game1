/* ─── Reset & Base ─── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #1a0a2e;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: 'Arial Rounded MT Bold', 'Comic Sans MS', Arial, sans-serif;
  overflow: hidden;

/* ─── Game Container ─── */
#game-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

#game-canvas {
  border: 4px solid #7c3aed;
  border-radius: 12px;
  box-shadow: 0 0 40px rgba(124, 58, 237, 0.6), 0 0 80px rgba(124, 58, 237, 0.2);
  display: block;
  max-width: 100vw;
  max-height: calc(100vh - 100px);

/* ─── Virtual Controls (mobile) ─── */

  display: flex;
  justify-content: space-between;
  width: 100%;
  max-width: 800px;
  padding: 0 8px;
}

#vpad-left, #vpad-right {

  color: white;
  font-size: 22px;
  cursor: pointer;
  touch-action: none;
  transition: background 0.1s;
  -webkit-tap-highlight-color: transparent;

.vbtn:active {

/* Hide virtual controls on desktop */

  #virtual-controls {

/* Responsive canvas scaling */
@media (max-width: 820px) {
  #game-canvas {
    width: 100vw;
    height: calc(100vw * 0.625);
  }
}

// ═══════ src/utils.js ═══════
// utils.js — Drawing helpers, AABB collision, math utilities

// ── Canvas Drawing Helpers ────────────────────────────────────────────────────

/** Rounded rectangle path */
function roundRectPath(ctx, x, y, w, h, r = 8) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

/** Fill a rounded rectangle */
function fillRoundRect(ctx, x, y, w, h, r, color) {
  ctx.fillStyle = color;
  roundRectPath(ctx, x, y, w, h, r);
  ctx.fill();
}

/** Stroke a rounded rectangle */
function strokeRoundRect(ctx, x, y, w, h, r, color, lw = 2) {
  ctx.strokeStyle = color;
  ctx.lineWidth = lw;
  roundRectPath(ctx, x, y, w, h, r);
  ctx.stroke();
}

/** Draw platform with top highlight */
function drawPlatform(ctx, x, y, w, h, color, topColor) {
  topColor = topColor || lighten(color, 40);
  fillRoundRect(ctx, x, y, w, h, 6, color);
  // Top strip highlight
  ctx.fillStyle = topColor;
  roundRectPath(ctx, x + 3, y + 2, w - 6, 7, 3);
  ctx.fill();
}

/** Draw a simple flat button */
function drawButton(ctx, x, y, w, h, label, bgColor, textColor, hovered = false) {
  const col = hovered ? lighten(bgColor, 30) : bgColor;
  fillRoundRect(ctx, x, y, w, h, 12, col);
  strokeRoundRect(ctx, x, y, w, h, 12, 'rgba(255,255,255,0.5)', 2);
  ctx.fillStyle = textColor || '#fff';
  ctx.font = `bold ${Math.min(h * 0.45, 22)}px Arial`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, x + w / 2, y + h / 2);
}

/** Draw text with outline for readability */
function drawText(ctx, text, x, y, size, color, align = 'center', outline = true) {
  ctx.font = `bold ${size}px Arial`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  if (outline) {
    ctx.strokeStyle = 'rgba(0,0,0,0.7)';
    ctx.lineWidth = Math.max(2, size * 0.12);
    ctx.strokeText(text, x, y);
  }
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

/** Draw emoji at position */
function drawEmoji(ctx, emoji, x, y, size = 32) {
  ctx.font = `${size}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(emoji, x, y);
}

/** Draw a star shape */
function drawStar(ctx, cx, cy, r, color = '#FFD700') {
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const angle = (i * Math.PI) / 5 - Math.PI / 2;
    const radius = i % 2 === 0 ? r : r * 0.45;
    if (i === 0) ctx.moveTo(cx + Math.cos(angle) * radius, cy + Math.sin(angle) * radius);
    else ctx.lineTo(cx + Math.cos(angle) * radius, cy + Math.sin(angle) * radius);
  }
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = darken(color, 30);
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

/** Draw a simple cartoon character (player / NPC) */
function drawCharacter(ctx, x, y, w, h, bodyColor, faceEmoji, flipX = false, bounce = 0) {
  const bx = flipX ? x + w : x;
  ctx.save();
  ctx.translate(bx, y + bounce);
  if (flipX) ctx.scale(-1, 1);

  // Body
  fillRoundRect(ctx, 0, h * 0.3, w, h * 0.7, 8, bodyColor);
  // Head
  ctx.fillStyle = '#FFDAB9';
  ctx.beginPath();
  ctx.ellipse(w / 2, h * 0.22, w * 0.38, h * 0.28, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = darken('#FFDAB9', 20);
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Eyes
  ctx.fillStyle = '#333';
  ctx.beginPath(); ctx.arc(w * 0.38, h * 0.20, 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(w * 0.62, h * 0.20, 2.5, 0, Math.PI * 2); ctx.fill();

  // Smile
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(w / 2, h * 0.24, w * 0.12, 0.1, Math.PI - 0.1);
  ctx.stroke();

  // Hat (small triangle on head)
  ctx.fillStyle = bodyColor;
  ctx.beginPath();
  ctx.moveTo(w * 0.28, h * 0.04);
  ctx.lineTo(w * 0.72, h * 0.04);
  ctx.lineTo(w / 2, -h * 0.10);
  ctx.closePath();
  ctx.fill();

  if (faceEmoji) {
    ctx.font = `${h * 0.28}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(faceEmoji, w / 2, h * 0.22);
  }

  ctx.restore();
}

/** Draw a simple cloud */
function drawCloud(ctx, x, y, scale = 1) {
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  const draw = (dx, dy, r) => { ctx.beginPath(); ctx.arc(x + dx * scale, y + dy * scale, r * scale, 0, Math.PI * 2); ctx.fill(); };
  draw(0, 0, 22); draw(-22, 5, 16); draw(22, 5, 16); draw(-10, -10, 14); draw(12, -8, 18);
}

/** Lighten a hex color by amount (0-255) */
function lighten(hex, amount) {
  return adjustColor(hex, amount);
}

/** Darken a hex color by amount (0-255) */
function darken(hex, amount) {
  return adjustColor(hex, -amount);
}

function adjustColor(hex, amount) {
  const n = parseInt(hex.replace('#', ''), 16);
  const r = Math.min(255, Math.max(0, (n >> 16) + amount));
  const g = Math.min(255, Math.max(0, ((n >> 8) & 0xFF) + amount));
  const b = Math.min(255, Math.max(0, (n & 0xFF) + amount));
  return `rgb(${r},${g},${b})`;
}

// ── AABB Collision ────────────────────────────────────────────────────────────

/** Returns true if two axis-aligned boxes overlap */
function aabbOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

/**
 * Resolve collision between a moving body and a static box.
 * Separates on the minimum penetration axis.
 * @param {Object} body  — { x, y, w, h, vx, vy, onGround }
 * @param {Object} box   — { x, y, w, h }
 * @param {boolean} onlyTop — if true, only resolve top surface (one-way platform)
 */
function resolveBodyBox(body, box, onlyTop = false) {
  if (!aabbOverlap(body.x, body.y, body.w, body.h, box.x, box.y, box.w, box.h)) return false;

  const overlapX = (body.x + body.w / 2) - (box.x + box.w / 2);
  const overlapY = (body.y + body.h / 2) - (box.y + box.h / 2);
  const halfW = (body.w + box.w) / 2;
  const halfH = (body.h + box.h) / 2;
  const penX = halfW - Math.abs(overlapX);
  const penY = halfH - Math.abs(overlapY);

  if (onlyTop) {
    // Only collide when body is landing on top
    if (overlapY < 0 && body.vy >= 0 && penY < penX) {
      body.y -= penY;
      body.vy = Math.min(body.vy, 0);
      body.onGround = true;
    }
    return true;
  }

  if (penX < penY) {
    // Push out horizontally
    body.x += overlapX > 0 ? penX : -penX;
    body.vx = 0;
  } else {
    // Push out vertically
    if (overlapY < 0) {
      // Landing on top
      body.y -= penY;
      if (body.vy > 0) { body.vy = 0; body.onGround = true; }
    } else {
      // Hitting ceiling
      body.y += penY;
      if (body.vy < 0) body.vy = 0;
    }
  }
  return true;
}

// ── Math Utilities ────────────────────────────────────────────────────────────

function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
function lerp(a, b, t)    { return a + (b - a) * t; }
function randInt(lo, hi)  { return Math.floor(Math.random() * (hi - lo + 1)) + lo; }
function randFloat(lo, hi){ return Math.random() * (hi - lo) + lo; }
function dist(ax, ay, bx, by) { return Math.hypot(bx - ax, by - ay); }

/** Linear interpolation with clamping */
function lerpClamped(a, b, t) { return lerp(a, b, clamp(t, 0, 1)); }


// ═══════ src/audio.js ═══════
// audio.js — Web Audio API synthesizer (zero asset files needed)
// All sounds are generated procedurally. Safe start/stop, no stacking.

class AudioSystem {
  constructor() {
    this._ctx = null;
    this._bgGain = null;
    this._bgTimer = null;
    this._enabled = true;
    this._bgPlaying = false;
  }

  // ── Enable / disable ──────────────────────────────────
  setEnabled(val) {
    this._enabled = !!val;
    if (!this._enabled) {
      this._stopBg();
    } else {
      this._startBg();
    }
  }

  isEnabled() { return this._enabled; }

  // ── Lazy AudioContext (needs user gesture first) ──────
  _ctx_get() {
    if (!this._ctx) {
      try {
        this._ctx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (_) { return null; }
    }
    if (this._ctx.state === 'suspended') {
      this._ctx.resume().catch(() => {});
    }
    return this._ctx;
  }

  // ── Core tone synthesizer ─────────────────────────────
  _tone(freq, dur, type = 'sine', vol = 0.3, when = 0) {
    if (!this._enabled) return;
    const ctx = this._ctx_get();
    if (!ctx) return;
    const t = ctx.currentTime + when;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.01);
  }

  // ── Sound effects ─────────────────────────────────────
  sfxJump() {
    this._tone(350, 0.08, 'square', 0.18);
    this._tone(500, 0.10, 'square', 0.15, 0.07);
  }

  sfxCollect() {
    this._tone(900, 0.06, 'sine', 0.28);
    this._tone(1200, 0.10, 'sine', 0.22, 0.05);
  }

  sfxWin() {
    [523, 659, 784, 1047].forEach((f, i) => this._tone(f, 0.25, 'sine', 0.35, i * 0.12));
  }

  sfxFail() {
    this._tone(280, 0.10, 'sawtooth', 0.28);
    this._tone(200, 0.15, 'sawtooth', 0.25, 0.10);
    this._tone(140, 0.25, 'sawtooth', 0.22, 0.22);
  }

  sfxClick() {
    this._tone(900, 0.05, 'sine', 0.18);
  }

  sfxHit() {
    this._tone(180, 0.12, 'sawtooth', 0.3);
    this._tone(120, 0.18, 'sawtooth', 0.25, 0.08);
  }

  sfxCorrect() {
    this._tone(660, 0.08, 'sine', 0.25);
    this._tone(880, 0.12, 'sine', 0.22, 0.07);
  }

  sfxWrong() {
    this._tone(220, 0.15, 'sawtooth', 0.28);
  }

  sfxPop() {
    this._tone(600, 0.05, 'triangle', 0.2);
    this._tone(200, 0.08, 'triangle', 0.15, 0.04);
  }

  sfxFunny() {
    [440, 494, 440, 392].forEach((f, i) => this._tone(f, 0.12, 'triangle', 0.22, i * 0.10));
  }

  // ── Background music ──────────────────────────────────
  // A simple cheerful looping arpeggio
  _startBg() {
    if (!this._enabled || this._bgPlaying) return;
    const ctx = this._ctx_get();
    if (!ctx) return;

    this._bgPlaying = true;
    this._bgGain = ctx.createGain();
    this._bgGain.gain.value = 0.06;
    this._bgGain.connect(ctx.destination);

    const melody = [523, 659, 784, 659, 523, 440, 494, 523, 587, 659, 784, 880, 784, 659, 587, 523];
    const bass   = [130, 130, 165, 165, 130, 110, 123, 130, 147, 165, 196, 220, 196, 165, 147, 130];
    let beat = 0;
    const BPM = 0.22; // seconds per note

    const tick = () => {
      if (!this._bgPlaying || !this._bgGain) return;
      const c = ctx.currentTime;

      // Melody note
      const o1 = ctx.createOscillator();
      o1.type = 'triangle';
      o1.frequency.value = melody[beat % melody.length];
      const g1 = ctx.createGain();
      g1.gain.setValueAtTime(0.12, c);
      g1.gain.exponentialRampToValueAtTime(0.0001, c + BPM * 0.85);
      o1.connect(g1); g1.connect(this._bgGain);
      o1.start(c); o1.stop(c + BPM);

      // Bass note (every 4 beats)
      if (beat % 4 === 0) {
        const o2 = ctx.createOscillator();
        o2.type = 'sine';
        o2.frequency.value = bass[Math.floor(beat / 4) % bass.length];
        const g2 = ctx.createGain();
        g2.gain.setValueAtTime(0.18, c);
        g2.gain.exponentialRampToValueAtTime(0.0001, c + BPM * 3.5);
        o2.connect(g2); g2.connect(this._bgGain);
        o2.start(c); o2.stop(c + BPM * 4);
      }

      beat++;
      this._bgTimer = setTimeout(tick, BPM * 1000);
    };

    tick();
  }

  _stopBg() {
    this._bgPlaying = false;
    if (this._bgTimer) { clearTimeout(this._bgTimer); this._bgTimer = null; }
    if (this._bgGain) {
      try { this._bgGain.gain.value = 0; this._bgGain.disconnect(); } catch (_) {}
      this._bgGain = null;
    }
  }

  // Call once after first user gesture
  startMusic() {
    this._startBg();
  }

  stopMusic() {
    this._stopBg();
  }

  restartMusic() {
    this._stopBg();
    setTimeout(() => this._startBg(), 50);
  }
}


// ═══════ src/input.js ═══════
// input.js — Unified keyboard + mouse/touch input
// Tracks held keys and clicked positions. Never accumulates duplicate listeners.

class InputSystem {
  constructor(canvas) {
    this.canvas = canvas;

    // Keyboard state
    this.keys = {};          // code → held
    this.justPressed = {};   // code → consumed once
    this._keysDown = {};     // raw set for justPressed tracking

    // Mouse / touch
    this.mouseX = 0;
    this.mouseY = 0;
    this.clicks = [];        // Array of {x,y} — consumed by game each frame

    // Virtual button state (mobile)
    this.vLeft  = false;
    this.vRight = false;
    this.vJump  = false;
    this.vAction = false;

    this._setupListeners();
  }

  // ── Setup ─────────────────────────────────────────────
  _setupListeners() {
    // Keyboard
    this._onKeyDown = (e) => {
      if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) {
        e.preventDefault();
      }
      if (!this._keysDown[e.code]) {
        this.justPressed[e.code] = true;
      }
      this._keysDown[e.code] = true;
      this.keys[e.code] = true;
    };
    this._onKeyUp = (e) => {
      this._keysDown[e.code] = false;
      this.keys[e.code] = false;
    };
    window.addEventListener('keydown', this._onKeyDown);
    window.addEventListener('keyup',   this._onKeyUp);

    // Canvas click
    this._onClick = (e) => {
      const r = this.canvas.getBoundingClientRect();
      const scaleX = this.canvas.width  / r.width;
      const scaleY = this.canvas.height / r.height;
      const x = (e.clientX - r.left) * scaleX;
      const y = (e.clientY - r.top)  * scaleY;
      this.clicks.push({ x, y });
    };
    this.canvas.addEventListener('click', this._onClick);

    // Canvas mousemove
    this._onMouseMove = (e) => {
      const r = this.canvas.getBoundingClientRect();
      this.mouseX = (e.clientX - r.left) * (this.canvas.width  / r.width);
      this.mouseY = (e.clientY - r.top)  * (this.canvas.height / r.height);
    };
    this.canvas.addEventListener('mousemove', this._onMouseMove);

    // Touch tap on canvas
    this._onTouchEnd = (e) => {
      e.preventDefault();
      const r = this.canvas.getBoundingClientRect();
      const scaleX = this.canvas.width  / r.width;
      const scaleY = this.canvas.height / r.height;
      for (const t of e.changedTouches) {
        this.clicks.push({
          x: (t.clientX - r.left) * scaleX,
          y: (t.clientY - r.top)  * scaleY,
        });
      }
    };
    this.canvas.addEventListener('touchend', this._onTouchEnd, { passive: false });

    // Virtual buttons
    this._setupVirtualButtons();
  }

  _setupVirtualButtons() {
    const map = [
      ['vbtn-left',   () => { this.vLeft  = true;  }, () => { this.vLeft  = false; }],
      ['vbtn-right',  () => { this.vRight = true;  }, () => { this.vRight = false; }],
      ['vbtn-jump',   () => { this.vJump  = true; this.justPressed['Space'] = true; },
                      () => { this.vJump  = false; }],
      ['vbtn-action', () => { this.vAction = true; this.justPressed['KeyE'] = true; },
                      () => { this.vAction = false; }],
    ];
    for (const [id, onDown, onUp] of map) {
      const el = document.getElementById(id);
      if (!el) continue;
      el.addEventListener('touchstart', (e) => { e.preventDefault(); onDown(); }, { passive: false });
      el.addEventListener('touchend',   (e) => { e.preventDefault(); onUp();   }, { passive: false });
      el.addEventListener('mousedown',  onDown);
      el.addEventListener('mouseup',    onUp);
    }
  }

  // ── Per-frame API ─────────────────────────────────────

  /** Returns true while key is held. Also checks virtual buttons for directional. */
  held(code) {
    if (code === 'ArrowLeft'  || code === 'KeyA') return this.keys[code] || this.keys['ArrowLeft'] || this.keys['KeyA'] || this.vLeft;
    if (code === 'ArrowRight' || code === 'KeyD') return this.keys[code] || this.keys['ArrowRight'] || this.keys['KeyD'] || this.vRight;
    if (code === 'Space' || code === 'ArrowUp' || code === 'KeyW') {
      return this.keys[code] || this.keys['Space'] || this.keys['ArrowUp'] || this.keys['KeyW'] || this.vJump;
    }
    return !!this.keys[code];
  }

  /** Returns true once per press, then resets. */
  pressed(code) {
    if (this.justPressed[code]) {
      delete this.justPressed[code];
      return true;
    }
    return false;
  }

  /** Consume all clicks and return them. */
  consumeClicks() {
    const c = this.clicks.slice();
    this.clicks.length = 0;
    return c;
  }

  /** Call at start of each frame to clear one-frame state. */
  endFrame() {
    // justPressed consumed by pressed() calls — any leftovers cleared here
    this.justPressed = {};
  }

  destroy() {
    window.removeEventListener('keydown', this._onKeyDown);
    window.removeEventListener('keyup',   this._onKeyUp);
    this.canvas.removeEventListener('click',     this._onClick);
    this.canvas.removeEventListener('mousemove', this._onMouseMove);
    this.canvas.removeEventListener('touchend',  this._onTouchEnd);
  }
}

// save.js — LocalStorage save/load system
// Robust: never corrupts; always falls back to default data.

const SAVE_KEY = 'prank_island_v1';

function defaultData() {
  return {
    unlockedLevels: [1],   // Set of unlocked level IDs (1-based)
    stars: {},             // { "1": true, "5": true, ... }
    soundOn: true,
    highestUnlocked: 1,
  };
}

class SaveSystem {
  constructor() {
    this.data = this._load();
  }

  _load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        // Merge with defaults to handle missing fields in old saves
        return Object.assign(defaultData(), parsed);
      }
    } catch (_) { /* ignore parse errors */ }
    return defaultData();
  }

  _persist() {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify(this.data));
    } catch (_) { /* ignore storage errors */ }
  }

  // ── Level unlock ──────────────────────────────────────
  isUnlocked(levelId) {
    return this.data.unlockedLevels.includes(levelId);
  }

  unlockLevel(levelId) {
    if (!this.isUnlocked(levelId)) {
      this.data.unlockedLevels.push(levelId);
    }
    if (levelId > this.data.highestUnlocked) {
      this.data.highestUnlocked = levelId;
    }
    this._persist();
  }

  // ── Stars ─────────────────────────────────────────────
  hasStar(levelId) {
    return !!this.data.stars[String(levelId)];
  }

  awardStar(levelId) {
    this.data.stars[String(levelId)] = true;
    this._persist();
  }

  getTotalStars() {
    return Object.values(this.data.stars).filter(Boolean).length;
  }

  // ── Sound ─────────────────────────────────────────────
  getSoundOn() { return this.data.soundOn; }

  setSoundOn(val) {
    this.data.soundOn = !!val;
    this._persist();
  }

  // ── Reset ─────────────────────────────────────────────
  resetAll() {
    this.data = defaultData();
    this._persist();
  }
}
