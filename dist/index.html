// ═══════ src/player.js ═══════
// player.js — Player controller: physics, animation, rendering


// Physics constants
const GRAVITY      = 1800;  // px/s²
const MOVE_SPEED   = 230;   // px/s horizontal
const JUMP_VEL     = -560;  // px/s initial jump velocity
const MAX_FALL     = 900;   // px/s terminal velocity
const COYOTE_TIME  = 0.10;  // seconds of "late jump" grace

const PW = 32;   // player width
const PH = 42;   // player height

const PLAYER_COLORS = ['#E74C3C', '#3498DB', '#2ECC71', '#F39C12', '#9B59B6'];

class Player {
  constructor(x, y, colorIndex = 0) {
    // Position & size
    this.x = x;
    this.y = y;
    this.w = PW;
    this.h = PH;

    // Velocity
    this.vx = 0;
    this.vy = 0;

    // State flags
    this.onGround = false;
    this.coyoteTimer = 0;
    this.alive = true;
    this.celebrating = false;
    this.celebrateTimer = 0;
    this.dead = false;
    this.deadTimer = 0;

    // Visual
    this.bodyColor = PLAYER_COLORS[colorIndex % PLAYER_COLORS.length];
    this.facingLeft = false;
    this.bounceAnim = 0; // oscillates for run animation
    this.bounceDir  = 1;

    // Carrying item (for placement levels)
    this.carrying = null; // { emoji, id }
  }

  /** Call every frame with dt and array of solid platforms. */
  update(dt, platforms, input, audio, game) {
    if (!this.alive) {
      if (this.dead) {
        this.deadTimer += dt;
        this.vy += GRAVITY * dt * 0.5;
        this.y  += this.vy * dt;
      }
      return;
    }

    if (this.celebrating) {
      this.celebrateTimer += dt;
      this.bounceAnim = Math.sin(this.celebrateTimer * 12) * 5;
      return;
    }

    // ── Horizontal movement ──────────────────────────────
    const moveLeft  = input.held('ArrowLeft');
    const moveRight = input.held('ArrowRight');

    if (moveLeft)  { this.vx = -MOVE_SPEED; this.facingLeft = true;  }
    else if (moveRight) { this.vx = MOVE_SPEED; this.facingLeft = false; }
    else { this.vx = 0; }

    // ── Coyote time ──────────────────────────────────────
    if (this.onGround) this.coyoteTimer = COYOTE_TIME;
    else if (this.coyoteTimer > 0) this.coyoteTimer -= dt;

    // ── Jump ─────────────────────────────────────────────
    const jumpPressed = input.pressed('Space') || input.pressed('ArrowUp') || input.pressed('KeyW');
    if (jumpPressed && this.coyoteTimer > 0) {
      this.vy = JUMP_VEL;
      this.coyoteTimer = 0;
      if (audio) audio.sfxJump();
    }

    // ── Gravity ──────────────────────────────────────────
    this.vy += GRAVITY * dt;
    this.vy  = clamp(this.vy, -1200, MAX_FALL);

    // ── Move X first, resolve, then Y ────────────────────
    this.x += this.vx * dt;
    this.onGround = false;
    for (const p of platforms) {
      if (!p.solid) continue;
      // Horizontal resolution
      if (aabbOverlap(this.x, this.y + 2, this.w, this.h - 4, p.x, p.y, p.w, p.h)) {
        const cx = (this.x + this.w / 2) - (p.x + p.w / 2);
        const halfW = (this.w + p.w) / 2;
        const pen = halfW - Math.abs(cx);
        if (pen > 0 && pen < 16) {
          this.x += cx > 0 ? pen : -pen;
          this.vx = 0;
        }
      }
    }

    this.y += this.vy * dt;
    for (const p of platforms) {
      if (!p.solid) continue;
      resolveBodyBox(this, p, p.oneWay || false);
    }

    // ── Canvas bounds ────────────────────────────────────
    if (game) {
      if (this.x < 0) { this.x = 0; this.vx = 0; }
      if (this.x + this.w > game.W) { this.x = game.W - this.w; this.vx = 0; }
    }

    // ── Walk bounce animation ────────────────────────────
    if (this.onGround && (moveLeft || moveRight)) {
      this.bounceAnim += dt * 18 * this.bounceDir;
      if (this.bounceAnim > 3)  this.bounceDir = -1;
      if (this.bounceAnim < -3) this.bounceDir =  1;
    } else {
      this.bounceAnim *= 0.85;
    }
  }

  celebrate() {
    this.alive = true;
    this.celebrating = true;
    this.celebrateTimer = 0;
    this.vx = 0; this.vy = 0;
  }

  die() {
    this.alive = false;
    this.dead  = true;
    this.deadTimer = 0;
    this.vy = -350;
    this.vx = 0;
  }

  /** Render the player on canvas */
  render(ctx) {
    if (!this.alive && this.dead) {
      // Spinning dead animation
      ctx.save();
      ctx.translate(this.x + this.w / 2, this.y + this.h / 2);
      ctx.rotate(this.deadTimer * 8);
      ctx.globalAlpha = Math.max(0, 1 - this.deadTimer);
      drawCharacter(ctx, -this.w / 2, -this.h / 2, this.w, this.h, this.bodyColor, '😵', false, 0);
      ctx.restore();
      return;
    }

    const bounce = this.bounceAnim;
    const face = this.celebrating ? '🎉' : null;
    drawCharacter(ctx, this.x, this.y, this.w, this.h, this.bodyColor, face, this.facingLeft, bounce);

    // Carrying indicator
    if (this.carrying) {
      ctx.font = '18px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(this.carrying.emoji, this.x + this.w / 2, this.y - 14);
    }
  }

  /** Get center position */
  centerX() { return this.x + this.w / 2; }
  centerY() { return this.y + this.h / 2; }

  /** AABB for collision queries */
  bounds() { return { x: this.x, y: this.y, w: this.w, h: this.h }; }
}


// ═══════ src/levelManager.js ═══════
// levelManager.js — Level loading, updating, rendering, and unloading
// Each mechanic type is a self-contained mini-engine driven by level config data.




const W = 800, H = 500;

// ─────────────────────────────────────────────────────────────────────────────
//  LevelManager
// ─────────────────────────────────────────────────────────────────────────────
class LevelManager {
  constructor(game) {
    this.game = game;
    this.currentLevel = null;  // level config
    this.state = null;          // live state object (fresh per load)
    this._timers = [];          // [ timeoutId ]  cleaned on unload
    this._intervals = [];       // [ intervalId ] cleaned on unload
  }

  // ── Public API ──────────────────────────────────────────────────────────────

  loadLevel(levelConfig) {
    this._cleanup();
    this.currentLevel = levelConfig;
    this.state = this._buildState(levelConfig);
  }

  unloadLevel() {
    this._cleanup();
    this.currentLevel = null;
    this.state = null;
  }

  update(dt) {
    if (!this.state || this.state.done) return;
    const lv = this.currentLevel;
    switch (lv.type) {
      case M.PLATFORM_RUN:  this._updatePlatformRun(dt);  break;
      case M.COLLECTOR:     this._updateCollector(dt);     break;
      case M.CHASE:         this._updateChase(dt);         break;
      case M.PATTERN:       this._updatePattern(dt);       break;
      case M.CHOICE:        this._updateChoice(dt);        break;
      case M.AVOID_COLLECT: this._updateAvoidCollect(dt);  break;
      case M.BOSS:          this._updateBoss(dt);          break;
    }
  }

  render(ctx) {
    if (!this.state) return;
    const lv = this.currentLevel;
    this._drawBackground(ctx, lv.theme);
    switch (lv.type) {
      case M.PLATFORM_RUN:  this._renderPlatformRun(ctx);  break;
      case M.COLLECTOR:     this._renderCollector(ctx);     break;
      case M.CHASE:         this._renderChase(ctx);         break;
      case M.PATTERN:       this._renderPattern(ctx);       break;
      case M.CHOICE:        this._renderChoice(ctx);        break;
      case M.AVOID_COLLECT: this._renderAvoidCollect(ctx);  break;
      case M.BOSS:          this._renderBoss(ctx);          break;
    }
  }

  isWon()  { return this.state && this.state.won;  }
  isFailed() { return this.state && this.state.failed; }

  // ── State builder ───────────────────────────────────────────────────────────

  _buildState(lv) {
    const platforms = lv.platforms ? lv.platforms(W, H) : [];
    const spawnX = lv.spawnX || 60;
    const spawnY = typeof lv.spawnY === 'function' ? lv.spawnY(H) : (lv.spawnY || H - 90);

    const s = {
      done: false, won: false, failed: false,
      platforms,
      player: new Player(spawnX, spawnY, 0),
      time: 0,
      timeLeft: lv.timeLimit || null,
      winTimer: 0,
      failTimer: 0,
      // mechanic-specific filled below
    };

    switch (lv.type) {
      case M.PLATFORM_RUN:  this._initPlatformRun(s, lv);  break;
      case M.COLLECTOR:     this._initCollector(s, lv);     break;
      case M.CHASE:         this._initChase(s, lv);         break;
      case M.PATTERN:       this._initPattern(s, lv);       break;
      case M.CHOICE:        this._initChoice(s, lv);        break;
      case M.AVOID_COLLECT: this._initAvoidCollect(s, lv);  break;
      case M.BOSS:          this._initBoss(s, lv);          break;
    }
    return s;
  }

  // ── Shared helpers ──────────────────────────────────────────────────────────

  _cleanup() {
    this._timers.forEach(id => clearTimeout(id));
    this._intervals.forEach(id => clearInterval(id));
    this._timers = [];
    this._intervals = [];
  }

  _setTimeout(fn, ms) {
    const id = setTimeout(fn, ms);
    this._timers.push(id);
    return id;
  }

  _triggerWin() {
    if (this.state.done) return;
    this.state.done = true;
    this.state.won = true;
    this.state.player.celebrate();
    if (this.game.audio) this.game.audio.sfxWin();
  }

  _triggerFail() {
    if (this.state.done) return;
    this.state.done = true;
    this.state.failed = true;
    this.state.player.die();
    if (this.game.audio) this.game.audio.sfxFail();
  }

  _updatePlayerPhysics(dt) {
    const s = this.state;
    s.player.update(dt, s.platforms, this.game.input, this.game.audio, this.game);
  }

  _checkFallDeath(player) {
    if (player.y > H + 60) { this._triggerFail(); }
  }

  _randomPos(margin = 60) {
    return { x: randFloat(margin, W - margin), y: randFloat(60, H - 100) };
  }

  _drawBackground(ctx, theme) {
    ctx.fillStyle = theme.bg;
    ctx.fillRect(0, 0, W, H);
    if (theme.cloud) {
      drawCloud(ctx, 80,  50, 1.0);
      drawCloud(ctx, 350, 35, 0.85);
      drawCloud(ctx, 650, 55, 1.1);
    }
  }

  _drawPlatforms(ctx, theme) {
    for (const p of this.state.platforms) {
      if (p.invisible) continue;
      drawPlatform(ctx, p.x, p.y, p.w, p.h, theme.platform || '#43A047', theme.accent || '#FFD54F');
    }
  }

  _drawGoal(ctx, lv) {
    const gx = lv.goalX;
    const gy = typeof lv.goalY === 'function' ? lv.goalY(H) : lv.goalY;
    if (gx === undefined) return;
    // Flag pole
    ctx.fillStyle = '#888';
    ctx.fillRect(gx + 14, gy - 40, 4, 60);
    drawEmoji(ctx, lv.goalEmoji || '🏁', gx + 16, gy - 50, 30);
    // Goal zone glow
    ctx.fillStyle = 'rgba(255,220,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(gx + 16, gy + 15, 32, 10, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  _checkGoalReached(player, lv) {
    const gx = lv.goalX;
    const gy = typeof lv.goalY === 'function' ? lv.goalY(H) : lv.goalY;
    if (gx === undefined) return false;
    return aabbOverlap(player.x, player.y, player.w, player.h, gx - 20, gy - 10, 60, 40);
  }

  // ════════════════════════════════════════════════════════════════════════════
  //  MECHANIC: PLATFORM_RUN
  // ════════════════════════════════════════════════════════════════════════════

  _initPlatformRun(s, lv) {
    s.eggs = [];
    s.eggTimer = 0;
    s.cart = lv.hasCart ? {
      x: lv.cartX || 200,
      y: typeof lv.cartY === 'function' ? lv.cartY(H) : H - 75,
      w: 48, h: 32, vx: 0, emoji: lv.cartEmoji || '🛒',
    } : null;
    s.enemies = [];
    if (lv.enemyCount > 0) {
      for (let i = 0; i < lv.enemyCount; i++) {
        s.enemies.push({ x: 300 + i * 200, y: H - 90, vx: 80, w: 32, h: 32, emoji: '🐔' });
      }
    }
    s.movingTiles = null;
    if (lv.movingTiles) {
      // 8 tiles across, alternating safe/danger, cycling
      s.movingTiles = Array.from({ length: 8 }, (_, i) => ({
        x: 60 + i * 90, y: lv.tileY ? lv.tileY(H) : H - 80,
        w: 70, h: 24, safe: true, timer: 0, period: 2 + i * 0.3,
      }));
    }
  }

  _updatePlatformRun(dt) {
    const s = this.state;
    const lv = this.currentLevel;
    if (s.done) return;

    // Timer
    if (s.timeLeft !== null) {
      s.timeLeft -= dt;
      if (s.timeLeft <= 0) { this._triggerFail(); return; }
    }

    // Player physics
    this._updatePlayerPhysics(dt);
    this._checkFallDeath(s.player);

    // Cart pushing
    if (s.cart) {
      const c = s.cart;
      // If player overlaps cart, push it
      if (aabbOverlap(s.player.x, s.player.y, s.player.w, s.player.h, c.x, c.y, c.w, c.h)) {
        c.vx = s.player.vx * 0.6;
      } else {
        c.vx *= 0.85;
      }
      c.x += c.vx * dt;
      c.x = clamp(c.x, 0, W - c.w);
      // Goal: cart reaches right side
      if (c.x > W - 80) { this._triggerWin(); return; }
    }

    // Falling eggs
    if (lv.eggsDropping || lv.hazards === 'mixed') {
      s.eggTimer += dt;
      if (s.eggTimer > 2.0) {
        s.eggTimer = 0;
        s.eggs.push({ x: randFloat(40, W - 40), y: -20, vy: randFloat(200, 350), emoji: '🥚', w: 24, h: 24 });
      }
    }
    for (const egg of s.eggs) {
      egg.y += egg.vy * dt;
      if (aabbOverlap(s.player.x, s.player.y, s.player.w, s.player.h, egg.x - 12, egg.y - 12, egg.w, egg.h)) {
        this._triggerFail(); return;
      }
    }
    s.eggs = s.eggs.filter(e => e.y < H + 40);

    // Moving enemies
    for (const en of s.enemies) {
      en.x += en.vx * dt;
      if (en.x < 40 || en.x > W - 80) en.vx *= -1;
      if (aabbOverlap(s.player.x, s.player.y, s.player.w, s.player.h, en.x, en.y, en.w, en.h)) {
        this._triggerFail(); return;
      }
    }

    // Moving tiles
    if (s.movingTiles) {
      let playerOnTile = false;
      for (const tile of s.movingTiles) {
        tile.timer += dt;
        // Each tile alternates safe/danger with offset period
        tile.safe = Math.sin(tile.timer * (Math.PI / tile.period)) > 0;
        if (aabbOverlap(s.player.x, s.player.y, s.player.w, s.player.h, tile.x, tile.y, tile.w, tile.h)) {
          if (!tile.safe) { this._triggerFail(); return; }
          playerOnTile = true;
          // Simple landing
          if (s.player.vy >= 0 && s.player.y + s.player.h > tile.y && s.player.y < tile.y + tile.h) {
            s.player.y = tile.y - s.player.h;
            s.player.vy = 0;
            s.player.onGround = true;
          }
        }
      }
      // If player is above the tile area and not on any tile, and below platforms → fall to death floor
    }

    // Goal check
    if (lv.goalX !== undefined && !s.cart && this._checkGoalReached(s.player, lv)) {
      this._triggerWin();
    }

    // Ice cream melt timer (cosmetic)
    if (lv.iceCreamMelt && s.timeLeft !== null && s.timeLeft <= 0) {
      this._triggerFail();
    }
  }

  _renderPlatformRun(ctx) {
    const s = this.state;
    const lv = this.currentLevel;
    const theme = lv.theme;

    this._drawPlatforms(ctx, theme);

    // Moving tiles
    if (s.movingTiles) {
      for (const tile of s.movingTiles) {
        ctx.fillStyle = tile.safe ? 'rgba(76,175,80,0.9)' : 'rgba(244,67,54,0.9)';
        roundRectPath(ctx, tile.x, tile.y, tile.w, tile.h, 6);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        roundRectPath(ctx, tile.x + 2, tile.y + 2, tile.w - 4, 6, 3);
        ctx.fill();
      }
    }

    // Cart
    if (s.cart) {
      drawEmoji(ctx, s.cart.emoji, s.cart.x + s.cart.w / 2, s.cart.y + s.cart.h / 2, 36);
      // Wheels
      ctx.fillStyle = '#444';
      ctx.beginPath(); ctx.arc(s.cart.x + 10, s.cart.y + s.cart.h + 6, 8, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(s.cart.x + s.cart.w - 10, s.cart.y + s.cart.h + 6, 8, 0, Math.PI * 2); ctx.fill();
    }

    // Goal
    this._drawGoal(ctx, lv);

    // Falling eggs
    for (const egg of s.eggs) drawEmoji(ctx, egg.emoji, egg.x, egg.y, 26);

    // Enemies
    for (const en of s.enemies) drawEmoji(ctx, en.emoji, en.x + 16, en.y + 16, 32);

    // Ice cream melt indicator
    if (lv.iceCreamMelt && s.timeLeft !== null) {
      const pct = s.timeLeft / lv.timeLimit;
      drawEmoji(ctx, pct > 0.4 ? '🍦' : pct > 0.2 ? '😰' : '💧', s.player.x + s.player.w / 2, s.player.y - 26, 22);
    }

    s.player.render(ctx);
  }

  // ════════════════════════════════════════════════════════════════════════════
  //  MECHANIC: COLLECTOR
  // ════════════════════════════════════════════════════════════════════════════

  _initCollector(s, lv) {
    const count = lv.itemCount || 4;
    const emoji = lv.itemEmoji || '⭐';
    const items = lv.items || null; // array of { emoji, label }

    s.items = Array.from({ length: count }, (_, i) => {
      const itemEmoji = items ? items[i % items.length].emoji : emoji;
      const pos = this._randomItemPos(i, count);
      return {
        x: pos.x, y: pos.y, w: 32, h: 32,
        emoji: itemEmoji,
        collected: false,
        bobOffset: randFloat(0, Math.PI * 2),
        vx: lv.itemBounce ? randFloat(-80, 80) : 0,
        vy: lv.itemBounce ? randFloat(-40, 40) : 0,
      };
    });
    s.collected = 0;
    s.npcX = W - 80;
    s.npcY = H - 90;
    // Monkey enemy (for level 6)
    s.monkeyX = lv.monkeyEnemy ? 400 : -1000;
    s.monkeyY = H - 80;
    s.monkeyVx = lv.monkeyEnemy ? 100 : 0;
  }

  _randomItemPos(i, total) {
    // Distribute items across screen to avoid spawn stacking
    const cols = 4, rows = 2;
    const col = i % cols;
    const row = Math.floor(i / cols) % rows;
    const x = 80 + col * 170 + randFloat(-40, 40);
    const y = 120 + row * 160 + randFloat(-30, 30);
    return { x: clamp(x, 40, W - 60), y: clamp(y, 60, H - 80) };
  }

  _updateCollector(dt) {
    const s = this.state;
    const lv = this.currentLevel;
    if (s.done) return;

    if (s.timeLeft !== null) {
      s.timeLeft -= dt;
      if (s.timeLeft <= 0) { this._triggerFail(); return; }
    }
    s.time += dt;

    this._updatePlayerPhysics(dt);
    this._checkFallDeath(s.player);

    // Monkey enemy (for L6)
    if (lv.monkeyEnemy) {
      s.monkeyX += s.monkeyVx * dt;
      if (s.monkeyX < 50 || s.monkeyX > W - 80) s.monkeyVx *= -1;
      if (aabbOverlap(s.player.x, s.player.y, s.player.w, s.player.h, s.monkeyX - 20, s.monkeyY - 20, 40, 40)) {
        this._triggerFail(); return;
      }
    }

    // Bouncing items
    for (const item of s.items) {
      if (item.collected) continue;
      if (lv.itemBounce) {
        item.x += item.vx * dt;
        item.y += item.vy * dt;
        if (item.x < 30 || item.x > W - 60)   { item.vx *= -1; item.x = clamp(item.x, 30, W - 60); }
        if (item.y < 50 || item.y > H - 60)    { item.vy *= -1; item.y = clamp(item.y, 50, H - 60); }
      } else {
        item.y += Math.sin(s.time * 2 + item.bobOffset) * 0.6;
      }

      if (aabbOverlap(s.player.x, s.player.y, s.player.w, s.player.h, item.x - 16, item.y - 16, item.w, item.h)) {
        item.collected = true;
        s.collected++;
        if (this.game.audio) this.game.audio.sfxCollect();
        if (s.collected >= lv.itemCount) {
          this._setTimeout(() => this._triggerWin(), 400);
        }
      }
    }
  }

  _renderCollector(ctx) {
    const s = this.state;
    const lv = this.currentLevel;
    const theme = lv.theme;

    this._drawPlatforms(ctx, theme);

    // Items
    for (const item of s.items) {
      if (item.collected) continue;
      // Glow ring
      ctx.fillStyle = 'rgba(255,220,50,0.2)';
      ctx.beginPath(); ctx.arc(item.x, item.y, 22, 0, Math.PI * 2); ctx.fill();
      drawEmoji(ctx, item.emoji, item.x, item.y, 30);
    }

    // NPC (robot/monkey) waiting for items
    if (lv.npcEmoji) {
      drawEmoji(ctx, lv.npcEmoji, s.npcX, s.npcY, 40);
      drawText(ctx, `${s.collected}/${lv.itemCount}`, s.npcX, s.npcY - 30, 14, '#fff', 'center', false);
    }

    // Monkey enemy
    if (lv.monkeyEnemy) {
      drawEmoji(ctx, '🐒', s.monkeyX, s.monkeyY, 38);
    }

    // Counter badge
    fillRoundRect(ctx, 10, 58, 130, 30, 8, 'rgba(0,0,0,0.5)');
    drawText(ctx, `جُمع: ${s.collected}/${lv.itemCount}`, 75, 73, 15, '#FFD700', 'center', false);

    s.player.render(ctx);
  }

  // ════════════════════════════════════════════════════════════════════════════
  //  MECHANIC: CHASE
  // ════════════════════════════════════════════════════════════════════════════

  _initChase(s, lv) {
    if (lv.chasePlayer) {
      // Enemy chases player (L14 vacuum)
      s.enemy = { x: 0, y: H - 80, w: 40, h: 40, emoji: lv.enemyEmoji || '🌀', speed: lv.enemySpeed || 100 };
      s.safeZone = { x: lv.safeZoneX || 650, y: H - 80, w: lv.safeZoneW || 120, h: 80 };
      s.safeReached = false;
    } else {
      // Player chases target (L1 chicken)
      const tx = typeof lv.targetStartX === 'function' ? lv.targetStartX : (lv.targetStartX || 500);
      const ty = typeof lv.targetStartY === 'function' ? lv.targetStartY(H) : (H - 80);
      s.target = { x: tx, y: ty, w: 36, h: 36, vx: lv.targetSpeed || 130, emoji: lv.targetEmoji || '🐔', caught: false };
      s.eggs = [];
      s.eggTimer = 0;
    }
  }

  _updateChase(dt) {
    const s = this.state;
    const lv = this.currentLevel;
    if (s.done) return;

    s.time += dt;
    if (s.timeLeft !== null) {
      s.timeLeft -= dt;
      if (s.timeLeft <= 0) { this._triggerFail(); return; }
    }

    this._updatePlayerPhysics(dt);
    this._checkFallDeath(s.player);

    if (lv.chasePlayer) {
      // Enemy moves toward player
      const en = s.enemy;
      const dx = s.player.x - en.x;
      const sign = dx > 0 ? 1 : -1;
      en.x += sign * en.speed * dt;
      en.x = clamp(en.x, 0, W - en.w);

      // Caught by enemy → fail
      if (aabbOverlap(s.player.x, s.player.y, s.player.w, s.player.h, en.x, en.y, en.w, en.h)) {
        this._triggerFail(); return;
      }

      // Safe zone → win
      if (aabbOverlap(s.player.x, s.player.y, s.player.w, s.player.h, s.safeZone.x, s.safeZone.y, s.safeZone.w, s.safeZone.h)) {
        this._triggerWin();
      }
    } else {
      // Target runs away from player
      const tgt = s.target;
      const dx = tgt.x - s.player.x;
      const runDir = dx > 0 ? 1 : -1;
      tgt.vx = runDir * lv.targetSpeed;
      if (lv.targetZigzag) {
        tgt.vx += Math.sin(s.time * 3) * 60;
      }
      tgt.x += tgt.vx * dt;
      tgt.x = clamp(tgt.x, 30, W - 60);

      // Eggs drop
      s.eggTimer += dt;
      if (s.eggTimer > lv.hazardFreq) {
        s.eggTimer = 0;
        s.eggs.push({ x: tgt.x, y: tgt.y - 10, vy: 300, emoji: lv.hazardEmoji || '🥚', w: 24, h: 24 });
      }
      for (const egg of s.eggs) {
        egg.y += egg.vy * dt;
        if (aabbOverlap(s.player.x, s.player.y, s.player.w, s.player.h, egg.x - 12, egg.y - 12, egg.w, egg.h)) {
          this._triggerFail(); return;
        }
      }
      s.eggs = s.eggs.filter(e => e.y < H + 40);

      // Player catches target
      if (aabbOverlap(s.player.x, s.player.y, s.player.w, s.player.h, tgt.x - 18, tgt.y - 18, tgt.w, tgt.h)) {
        tgt.caught = true;
        this._triggerWin();
      }
    }
  }

  _renderChase(ctx) {
    const s = this.state;
    const lv = this.currentLevel;
    const theme = lv.theme;
    this._drawPlatforms(ctx, theme);

    if (lv.chasePlayer) {
      // Safe zone
      ctx.fillStyle = 'rgba(0,200,80,0.3)';
      roundRectPath(ctx, s.safeZone.x, s.safeZone.y - 50, s.safeZone.w, s.safeZone.h + 50, 10);
      ctx.fill();
      ctx.strokeStyle = '#4CAF50';
      ctx.lineWidth = 3;
      ctx.stroke();
      drawText(ctx, 'آمن!', s.safeZone.x + s.safeZone.w / 2, s.safeZone.y - 20, 16, '#4CAF50', 'center', false);
      drawEmoji(ctx, s.enemy.emoji, s.enemy.x + s.enemy.w / 2, s.enemy.y + s.enemy.h / 2, 36);
    } else {
      const tgt = s.target;
      drawEmoji(ctx, tgt.emoji, tgt.x, tgt.y, 38);
      for (const egg of s.eggs) drawEmoji(ctx, egg.emoji, egg.x, egg.y, 26);
    }

    s.player.render(ctx);
  }

  // ════════════════════════════════════════════════════════════════════════════
  //  MECHANIC: PATTERN (Simon Says)
  // ════════════════════════════════════════════════════════════════════════════

  _initPattern(s, lv) {
    s.phase = 'showing';   // 'showing' | 'input' | 'feedback'
    s.round = 0;
    s.totalRounds = lv.rounds || 3;
    s.sequence = [];
    s.playerInput = [];
    s.showIndex = 0;
    s.showTimer = 0;
    s.showInterval = 0.75;
    s.feedbackTimer = 0;
    s.feedbackOk = false;
    s.buttons = this._makePatternButtons(lv);
    s.npcAnim = 0;
    s.activeButton = -1;
    s.pendingClicks = [];
    this._generateRound(s, lv);
  }

  _makePatternButtons(lv) {
    const colors = lv.colors || ['#F44336','#2196F3','#4CAF50','#FF9800'];
    const n = colors.length;
    const bw = 100, bh = 70, gap = 20;
    const totalW = n * bw + (n - 1) * gap;
    const startX = W / 2 - totalW / 2;
    return colors.map((color, i) => ({
      x: startX + i * (bw + gap), y: H / 2 + 30,
      w: bw, h: bh, color,
      label: lv.colorNames ? lv.colorNames[i] : String(i + 1),
      lit: false,
    }));
  }

  _generateRound(s, lv) {
    const n = lv.colors ? lv.colors.length : 4;
    const len = (lv.patternLength || 3) + s.round;
    s.sequence = Array.from({ length: len }, () => randInt(0, n - 1));
    s.playerInput = [];
    s.showIndex = 0;
    s.showTimer = 0;
    s.phase = 'showing';
    s.activeButton = -1;
    for (const btn of s.buttons) btn.lit = false;
  }

  _updatePattern(dt) {
    const s = this.state;
    const lv = this.currentLevel;
    if (s.done) return;

    s.time += dt;
    s.npcAnim = Math.sin(s.time * 3) * 4;

    if (s.phase === 'showing') {
      s.showTimer += dt;
      if (s.showTimer > s.showInterval) {
        s.showTimer = 0;
        if (s.activeButton >= 0) { s.buttons[s.activeButton].lit = false; s.activeButton = -1; }
        if (s.showIndex < s.sequence.length) {
          s.activeButton = s.sequence[s.showIndex];
          s.buttons[s.activeButton].lit = true;
          if (this.game.audio) this.game.audio.sfxCollect();
          s.showIndex++;
        } else {
          s.phase = 'input';
          s.activeButton = -1;
          for (const btn of s.buttons) btn.lit = false;
        }
      }
    } else if (s.phase === 'input') {
      // Process clicks
      const clicks = this.game.input ? this.game.input.consumeClicks() : [];
      for (const click of clicks) {
        for (let i = 0; i < s.buttons.length; i++) {
          const btn = s.buttons[i];
          if (click.x >= btn.x && click.x <= btn.x + btn.w && click.y >= btn.y && click.y <= btn.y + btn.h) {
            s.playerInput.push(i);
            btn.lit = true;
            this._setTimeout(() => { if (s.buttons[i]) s.buttons[i].lit = false; }, 200);

            const expected = s.sequence[s.playerInput.length - 1];
            if (i !== expected) {
              s.phase = 'feedback'; s.feedbackOk = false; s.feedbackTimer = 0;
              if (this.game.audio) this.game.audio.sfxWrong();
            } else if (s.playerInput.length === s.sequence.length) {
              s.round++;
              s.phase = 'feedback'; s.feedbackOk = true; s.feedbackTimer = 0;
              if (this.game.audio) this.game.audio.sfxCorrect();
            } else {
              if (this.game.audio) this.game.audio.sfxCollect();
            }
          }
        }
      }
    } else if (s.phase === 'feedback') {
      s.feedbackTimer += dt;
      if (s.feedbackTimer > 1.0) {
        if (s.feedbackOk) {
          if (s.round >= s.totalRounds) { this._triggerWin(); }
          else { this._generateRound(s, lv); }
        } else {
          this._triggerFail();
        }
      }
    }
  }

  _renderPattern(ctx) {
    const s = this.state;
    const lv = this.currentLevel;

    // NPC display
    ctx.fillStyle = lv.theme.bg;
    ctx.fillRect(0, 0, W, H);
    fillRoundRect(ctx, W / 2 - 200, 30, 400, 130, 16, 'rgba(0,0,0,0.4)');
    drawEmoji(ctx, lv.npcEmoji || '🐸', W / 2 - 150, 95 + s.npcAnim, 56);

    // Phase label
    const phaseLabel = s.phase === 'showing' ? 'شاهد النمط...' : s.phase === 'input' ? '🎯 كرر الآن!' : s.feedbackOk ? '✅ صح!' : '❌ غلط!';
    const phaseColor = s.phase === 'feedback' ? (s.feedbackOk ? '#4CAF50' : '#F44336') : '#FFD700';
    drawText(ctx, phaseLabel, W / 2, 65, 22, phaseColor, 'center');

    // Round indicator
    drawText(ctx, `جولة ${s.round + 1} / ${s.totalRounds}`, W / 2 + 100, 90, 16, '#aaa', 'center', false);

    // Sequence dots
    for (let i = 0; i < s.sequence.length; i++) {
      const filled = i < s.playerInput.length;
      const current = s.phase === 'showing' && i < s.showIndex;
      ctx.fillStyle = filled ? '#4CAF50' : current ? '#FFD700' : 'rgba(255,255,255,0.2)';
      ctx.beginPath(); ctx.arc(W / 2 - s.sequence.length * 12 + i * 24, 130, 8, 0, Math.PI * 2); ctx.fill();
    }

    // Pattern buttons
    for (const btn of s.buttons) {
      const alpha = btn.lit ? 1.0 : 0.65;
      ctx.globalAlpha = alpha;
      fillRoundRect(ctx, btn.x, btn.y, btn.w, btn.h, 12, btn.color);
      if (btn.lit) {
        ctx.shadowColor = btn.color; ctx.shadowBlur = 18;
        strokeRoundRect(ctx, btn.x - 2, btn.y - 2, btn.w + 4, btn.h + 4, 14, '#fff', 3);
        ctx.shadowBlur = 0;
      }
      ctx.globalAlpha = 1;
      drawText(ctx, btn.label, btn.x + btn.w / 2, btn.y + btn.h / 2, 18, '#fff', 'center');
    }

    // Feedback flash
    if (s.phase === 'feedback') {
      ctx.fillStyle = s.feedbackOk ? 'rgba(0,200,80,0.15)' : 'rgba(244,67,54,0.15)';
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ════════════════════════════════════════════════════════════════════════════
  //  MECHANIC: CHOICE (Multiple Choice / Pick Correct)
  // ════════════════════════════════════════════════════════════════════════════

  _initChoice(s, lv) {
    s.round = 0;
    s.totalRounds = lv.rounds || 3;
    s.phase = 'pick';   // 'pick' | 'feedback'
    s.feedbackTimer = 0;
    s.feedbackOk = false;
    s.selected = [];
    s.options = [];
    s.question = '';
    s.npcAnim = 0;
    this._buildChoiceRound(s, lv);
  }

  _buildChoiceRound(s, lv) {
    s.selected = [];
    s.phase = 'pick';
    s.feedbackTimer = 0;
    s.timeLeft = lv.timePerRound || null;

    if (lv.questions && lv.questions.length > 0) {
      // Fixed Q&A (L26)
      const q = lv.questions[s.round % lv.questions.length];
      s.question = q.q;
      s.options = q.options.map((label, i) => ({
        emoji: '', label, correct: i === q.correct, fakeHint: false,
      }));
    } else if (lv.multiSelect) {
      // Pick N correct from shuffled options (L17)
      s.question = `اختار ${lv.selectCount} مكونات صح!`;
      s.options = [...lv.options].sort(() => Math.random() - 0.5).map(o => ({ ...o }));
      s.selectCount = lv.selectCount;
    } else if (lv.options) {
      // Fixed option list
      s.question = lv.npcMessage || 'اختار!';
      s.options = [...lv.options].sort(() => Math.random() - 0.5).map(o => ({ ...o }));
    } else if (lv.foodOptions) {
      // Random food request (L18)
      const chosen = lv.foodOptions[randInt(0, lv.foodOptions.length - 1)];
      s.question = (lv.npcMessage || 'أريد: ') + chosen.emoji;
      s.options = [...lv.foodOptions].sort(() => Math.random() - 0.5).map(o => ({ ...o, correct: o.emoji === chosen.emoji }));
    } else if (lv.correctEmoji && lv.fakeEmoji) {
      // Find the correct one among fakes (L20)
      const choiceCount = lv.choiceCount || 4;
      s.question = lv.npcMessage || 'أين الصح؟';
      const correctIdx = randInt(0, choiceCount - 1);
      s.options = Array.from({ length: choiceCount }, (_, i) => ({
        emoji: i === correctIdx ? lv.correctEmoji : lv.fakeEmoji,
        label: i === correctIdx ? 'الحقيقية' : 'مزيفة',
        correct: i === correctIdx,
      }));
    } else if (lv.correctEmoji && lv.fakeEmojis) {
      // Chair / door pick (L21, L23)
      const choiceCount = lv.choiceCount || 3;
      s.question = lv.npcMessage || 'اختار!';
      const correctIdx = randInt(0, choiceCount - 1);
      s.options = Array.from({ length: choiceCount }, (_, i) => ({
        emoji: i === correctIdx ? lv.correctEmoji : lv.fakeEmojis[(i) % lv.fakeEmojis.length],
        label: i === correctIdx ? '✔' : '✘',
        correct: i === correctIdx,
      }));
    } else {
      // Generic button choice (L12 Wrong Button)
      const choiceCount = lv.choiceCount || 4;
      s.question = lv.npcMessage || 'اضغط الصح!';
      const correctIdx = randInt(0, choiceCount - 1);
      s.options = Array.from({ length: choiceCount }, (_, i) => ({
        emoji: i === correctIdx ? '✅' : '❌',
        label: i === correctIdx ? (lv.hintLabel || '✔') : '?',
        correct: i === correctIdx,
      }));
    }

    // Build button positions
    const n = s.options.length;
    const bw = Math.min(150, (W - 80) / n - 10);
    const bh = 80;
    const totalW = n * bw + (n - 1) * 14;
    const startX = W / 2 - totalW / 2;
    s.optionButtons = s.options.map((opt, i) => ({
      x: startX + i * (bw + 14), y: H / 2 + 40,
      w: bw, h: bh, opt,
      state: 'idle', // 'idle' | 'correct' | 'wrong'
    }));
  }

  _updateChoice(dt) {
    const s = this.state;
    const lv = this.currentLevel;
    if (s.done) return;

    s.time += dt;
    s.npcAnim = Math.sin(s.time * 2.5) * 4;

    // Time per round
    if (s.phase === 'pick' && s.timeLeft !== null) {
      s.timeLeft -= dt;
      if (s.timeLeft <= 0) {
        s.phase = 'feedback'; s.feedbackOk = false; s.feedbackTimer = 0;
        if (this.game.audio) this.game.audio.sfxWrong();
      }
    }

    if (s.phase === 'pick') {
      const clicks = this.game.input ? this.game.input.consumeClicks() : [];
      for (const click of clicks) {
        for (const btn of s.optionButtons) {
          if (click.x >= btn.x && click.x <= btn.x + btn.w && click.y >= btn.y && click.y <= btn.y + btn.h) {
            if (lv.multiSelect) {
              // Toggle selection
              const idx = s.selected.indexOf(btn);
              if (idx >= 0) { s.selected.splice(idx, 1); btn.state = 'idle'; }
              else if (s.selected.length < (lv.selectCount || 3)) { s.selected.push(btn); btn.state = 'selected'; }
              // Check if enough selected
              if (s.selected.length === (lv.selectCount || 3)) {
                const allCorrect = s.selected.every(b => b.opt.correct);
                s.phase = 'feedback'; s.feedbackOk = allCorrect; s.feedbackTimer = 0;
                s.selected.forEach(b => b.state = allCorrect ? 'correct' : 'wrong');
                if (this.game.audio) (allCorrect ? this.game.audio.sfxCorrect() : this.game.audio.sfxWrong());
              }
            } else {
              btn.state = btn.opt.correct ? 'correct' : 'wrong';
              s.feedbackOk = btn.opt.correct;
              s.phase = 'feedback'; s.feedbackTimer = 0;
              if (this.game.audio) (btn.opt.correct ? this.game.audio.sfxCorrect() : this.game.audio.sfxWrong());
            }
            break;
          }
        }
        if (s.phase === 'feedback') break;
      }
    } else if (s.phase === 'feedback') {
      s.feedbackTimer += dt;
      if (s.feedbackTimer > 1.2) {
        if (!s.feedbackOk) { this._triggerFail(); return; }
        s.round++;
        if (s.round >= s.totalRounds) { this._triggerWin(); return; }
        this._buildChoiceRound(s, lv);
      }
    }
  }

  _renderChoice(ctx) {
    const s = this.state;
    const lv = this.currentLevel;
    ctx.fillStyle = lv.theme.bg;
    ctx.fillRect(0, 0, W, H);

    // NPC
    fillRoundRect(ctx, W / 2 - 220, 25, 440, 140, 16, 'rgba(0,0,0,0.45)');
    drawEmoji(ctx, lv.npcEmoji || '🤖', W / 2 - 170, 95 + s.npcAnim, 56);
    drawText(ctx, s.question, W / 2 + 20, 90, 18, '#FFD700', 'center');
    drawText(ctx, `جولة ${s.round + 1} / ${s.totalRounds}`, W / 2, 130, 14, '#aaa', 'center', false);

    // Timer bar
    if (s.timeLeft !== null && lv.timePerRound) {
      const pct = clamp(s.timeLeft / lv.timePerRound, 0, 1);
      fillRoundRect(ctx, W / 2 - 150, 148, 300, 8, 4, '#333');
      fillRoundRect(ctx, W / 2 - 150, 148, 300 * pct, 8, 4, pct > 0.4 ? '#4CAF50' : '#F44336');
    }

    // Option buttons
    for (const btn of s.optionButtons) {
      let bg = '#1565C0';
      if (btn.state === 'correct') bg = '#2E7D32';
      else if (btn.state === 'wrong') bg = '#B71C1C';
      else if (btn.state === 'selected') bg = '#F57F17';
      fillRoundRect(ctx, btn.x, btn.y, btn.w, btn.h, 14, bg);
      strokeRoundRect(ctx, btn.x, btn.y, btn.w, btn.h, 14, 'rgba(255,255,255,0.4)', 2);
      if (btn.opt.emoji) drawEmoji(ctx, btn.opt.emoji, btn.x + btn.w / 2, btn.y + 28, 28);
      drawText(ctx, btn.opt.label, btn.x + btn.w / 2, btn.y + (btn.opt.emoji ? 60 : btn.h / 2), 14, '#fff', 'center');
    }

    // Feedback flash
    if (s.phase === 'feedback') {
      ctx.fillStyle = s.feedbackOk ? 'rgba(0,200,80,0.15)' : 'rgba(244,67,54,0.2)';
      ctx.fillRect(0, 0, W, H);
      drawText(ctx, s.feedbackOk ? '✅ صح!' : '❌ غلط!', W / 2, H / 2 - 30, 38,
        s.feedbackOk ? '#4CAF50' : '#F44336', 'center');
    }
  }

  // ════════════════════════════════════════════════════════════════════════════
  //  MECHANIC: AVOID_COLLECT
  // ════════════════════════════════════════════════════════════════════════════

  _initAvoidCollect(s, lv) {
    const itemCount = lv.targetCount || 5;
    const enemyCount = lv.enemyCount || 3;

    s.items = Array.from({ length: itemCount }, (_, i) => {
      const pos = this._randomItemPos(i, itemCount);
      return { x: pos.x, y: pos.y, w: 28, h: 28, emoji: lv.targetEmoji || '🟢', collected: false,
        vx: randFloat(-70, 70), vy: randFloat(-50, 50) };
    });
    s.enemies = Array.from({ length: Math.max(1, enemyCount) }, (_, i) => ({
      x: randFloat(200, W - 80), y: randFloat(80, H - 100),
      w: 32, h: 32, emoji: lv.enemyEmoji || '🐝',
      vx: randFloat(-80, 80) || 80, vy: randFloat(-60, 60),
      speed: (lv.enemySpeed || 100) + i * 15,
      targetPlayer: lv.calmOnCollect ? false : true,
    }));
    s.collected = 0;
    s.calmed = false;
  }

  _updateAvoidCollect(dt) {
    const s = this.state;
    const lv = this.currentLevel;
    if (s.done) return;

    s.time += dt;
    if (s.timeLeft !== null) {
      s.timeLeft -= dt;
      if (s.timeLeft <= 0) { this._triggerFail(); return; }
    }

    this._updatePlayerPhysics(dt);
    this._checkFallDeath(s.player);

    // Enemies
    for (const en of s.enemies) {
      if (s.calmed) { en.vx *= 0.9; en.vy *= 0.9; }
      else if (en.targetPlayer) {
        const dx = s.player.x - en.x, dy = s.player.y - en.y;
        const d = Math.hypot(dx, dy) || 1;
        en.vx = (dx / d) * en.speed;
        en.vy = (dy / d) * en.speed;
      } else {
        en.x += en.vx * dt;
        en.y += en.vy * dt;
        if (en.x < 20 || en.x > W - 60) { en.vx *= -1; }
        if (en.y < 55 || en.y > H - 60) { en.vy *= -1; }
        en.x = clamp(en.x, 10, W - 50); en.y = clamp(en.y, 55, H - 60);
        continue;
      }
      en.x += en.vx * dt; en.y += en.vy * dt;
      en.x = clamp(en.x, 10, W - 50); en.y = clamp(en.y, 55, H - 60);

      if (!s.calmed && aabbOverlap(s.player.x, s.player.y, s.player.w, s.player.h, en.x - 12, en.y - 12, en.w, en.h)) {
        this._triggerFail(); return;
      }
    }

    // Items (bouncing)
    for (const item of s.items) {
      if (item.collected) continue;
      item.x += item.vx * dt; item.y += item.vy * dt;
      if (item.x < 20 || item.x > W - 50) { item.vx *= -1; }
      if (item.y < 55 || item.y > H - 60) { item.vy *= -1; }
      if (aabbOverlap(s.player.x, s.player.y, s.player.w, s.player.h, item.x - 14, item.y - 14, item.w, item.h)) {
        item.collected = true;
        s.collected++;
        if (this.game.audio) this.game.audio.sfxCollect();
        if (lv.calmOnCollect && s.collected >= (lv.targetCount || 1)) {
          s.calmed = true;
          this._setTimeout(() => this._triggerWin(), 600);
        } else if (!lv.calmOnCollect && s.collected >= (lv.targetCount || 5)) {
          this._setTimeout(() => this._triggerWin(), 400);
        }
      }
    }
  }

  _renderAvoidCollect(ctx) {
    const s = this.state;
    const lv = this.currentLevel;
    const theme = lv.theme;
    this._drawPlatforms(ctx, theme);

    for (const item of s.items) {
      if (item.collected) continue;
      ctx.fillStyle = 'rgba(255,220,50,0.18)';
      ctx.beginPath(); ctx.arc(item.x, item.y, 20, 0, Math.PI * 2); ctx.fill();
      drawEmoji(ctx, item.emoji, item.x, item.y, 28);
    }
    for (const en of s.enemies) {
      drawEmoji(ctx, en.emoji, en.x + en.w / 2, en.y + en.h / 2, 32);
    }
    if (s.calmed) {
      drawText(ctx, '😊 هادي!', W / 2, H / 2 - 40, 26, '#4CAF50', 'center');
    }

    fillRoundRect(ctx, 10, 58, 130, 28, 8, 'rgba(0,0,0,0.5)');
    drawText(ctx, `جُمع: ${s.collected}/${lv.targetCount}`, 75, 72, 14, '#FFD700', 'center', false);

    s.player.render(ctx);
  }

  // ════════════════════════════════════════════════════════════════════════════
  //  MECHANIC: BOSS (Level 30 – King Farfoosh)
  // ════════════════════════════════════════════════════════════════════════════

  _initBoss(s, lv) {
    s.bossHp = lv.bossHp || 3;
    s.bossMaxHp = lv.bossHp || 3;
    s.bossX = W / 2 - 30;
    s.bossY = H - 110;
    s.bossVx = lv.bossSpeed || 90;
    s.bossDir = 1;
    s.bossPhase = 0;
    s.projectiles = [];
    s.attackTimer = 0;
    s.attackFreq = lv.phases ? lv.phases[0].attackFreq : 2.0;
    s.hitCooldown = 0;
    s.invincible = false;
    s.stars = []; // stars the player throws
    s.hittable = false;
    s.hittableTimer = 0;
    s.bossState = 'moving'; // 'moving' | 'stunned' | 'laughing'
    s.laughTimer = 0;
    s.hitCount = 0;
    // Stars are collectibles on the ground; player picks one up and can throw it
    s.groundStar = { x: W / 2, y: H - 75, w: 28, h: 28, available: true };
  }

  _updateBoss(dt) {
    const s = this.state;
    const lv = this.currentLevel;
    if (s.done) return;

    s.time += dt;
    this._updatePlayerPhysics(dt);
    this._checkFallDeath(s.player);

    // Phase from HP
    const phase = Math.min(lv.phases ? lv.phases.length - 1 : 0, lv.bossHp - s.bossHp);
    if (lv.phases) {
      s.attackFreq = lv.phases[phase].attackFreq;
      s.bossVx = lv.phases[phase].speed;
    }

    // Boss movement
    if (s.bossState === 'moving') {
      s.bossX += s.bossVx * s.bossDir * dt;
      if (s.bossX < 60) { s.bossX = 60; s.bossDir = 1; }
      if (s.bossX > W - 100) { s.bossX = W - 100; s.bossDir = -1; }

      // Attack: shoot projectile toward player
      s.attackTimer += dt;
      if (s.attackTimer > s.attackFreq) {
        s.attackTimer = 0;
        const dx = s.player.x - s.bossX, dy = s.player.y - s.bossY;
        const d = Math.hypot(dx, dy) || 1;
        const speed = 200;
        s.projectiles.push({ x: s.bossX + 30, y: s.bossY, vx: (dx / d) * speed, vy: (dy / d) * speed, w: 24, h: 24 });
      }
    } else if (s.bossState === 'stunned') {
      s.hittableTimer -= dt;
      if (s.hittableTimer <= 0) s.bossState = 'moving';
    } else if (s.bossState === 'laughing') {
      s.laughTimer += dt;
      if (s.laughTimer > 1.5) {
        if (this.game.audio) this.game.audio.sfxFunny();
        s.laughTimer = 0;
      }
    }

    // Projectiles
    for (const p of s.projectiles) {
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (aabbOverlap(s.player.x, s.player.y, s.player.w, s.player.h, p.x - 12, p.y - 12, p.w, p.h)) {
        this._triggerFail(); return;
      }
    }
    s.projectiles = s.projectiles.filter(p => p.x > -40 && p.x < W + 40 && p.y > -40 && p.y < H + 40);

    // Ground star pickup
    if (s.groundStar.available && !s.player.carrying) {
      if (aabbOverlap(s.player.x, s.player.y, s.player.w, s.player.h, s.groundStar.x - 14, s.groundStar.y - 14, 28, 28)) {
        s.player.carrying = { emoji: '⭐', id: 'star' };
        s.groundStar.available = false;
        if (this.game.audio) this.game.audio.sfxCollect();
      }
    }

    // Throw star (E key or action)
    if (s.player.carrying && (this.game.input.pressed('KeyE') || this.game.input.pressed('KeyF'))) {
      const dir = s.player.facingLeft ? -1 : 1;
      s.stars.push({ x: s.player.x + s.player.w / 2, y: s.player.y + s.player.h / 2, vx: dir * 380, vy: -150, w: 20, h: 20 });
      s.player.carrying = null;
      // Star respawns after 3s
      this._setTimeout(() => { if (s && !s.done) s.groundStar.available = true; }, 3000);
    }

    // Thrown stars hitting boss
    for (const star of s.stars) {
      star.x += star.vx * dt; star.y += star.vy * dt;
      star.vy += 400 * dt; // arc
      if (aabbOverlap(star.x - 10, star.y - 10, star.w, star.h, s.bossX, s.bossY, 64, 80)) {
        star.x = -999;
        s.bossHp--;
        s.bossState = 'stunned';
        s.hittableTimer = 1.5;
        if (this.game.audio) this.game.audio.sfxHit();
        if (s.bossHp <= 0) { this._triggerWin(); return; }
      }
    }
    s.stars = s.stars.filter(st => st.x > -100 && st.y < H + 60);
  }

  _renderBoss(ctx) {
    const s = this.state;
    const lv = this.currentLevel;
    const theme = lv.theme;
    this._drawPlatforms(ctx, theme);

    // Boss
    const phase = Math.min(lv.phases ? lv.phases.length - 1 : 0, lv.bossHp - s.bossHp);
    const bossColor = lv.phases ? lv.phases[phase].color : '#E53935';
    const wobble = s.bossState === 'stunned' ? Math.sin(s.time * 20) * 6 : Math.sin(s.time * 2) * 3;

    fillRoundRect(ctx, s.bossX + wobble, s.bossY, 64, 80, 10, bossColor);
    drawEmoji(ctx, '👑', s.bossX + 32 + wobble, s.bossY - 10, 36);
    // Eyes (angry or stunned)
    ctx.fillStyle = s.bossState === 'stunned' ? '#FFD700' : '#fff';
    ctx.beginPath(); ctx.arc(s.bossX + 20 + wobble, s.bossY + 28, 8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(s.bossX + 44 + wobble, s.bossY + 28, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(s.bossX + 22 + wobble, s.bossY + 30, 4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(s.bossX + 46 + wobble, s.bossY + 30, 4, 0, Math.PI * 2); ctx.fill();
    // Mouth
    if (s.bossState === 'stunned') {
      drawEmoji(ctx, '😵', s.bossX + 32 + wobble, s.bossY + 58, 24);
    } else {
      ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(s.bossX + 32 + wobble, s.bossY + 55, 12, 0.1, Math.PI - 0.1); ctx.stroke();
    }

    // HP bar
    const hpPct = clamp(s.bossHp / s.bossMaxHp, 0, 1);
    fillRoundRect(ctx, W / 2 - 120, 55, 240, 16, 8, '#333');
    fillRoundRect(ctx, W / 2 - 120, 55, 240 * hpPct, 16, 8, '#F44336');
    drawText(ctx, `الملك فرفوش ❤️ ${s.bossHp}/${s.bossMaxHp}`, W / 2, 75, 13, '#fff', 'center', false);

    // Projectiles
    for (const p of s.projectiles) drawEmoji(ctx, lv.projectileEmoji || '🌟', p.x, p.y, 24);

    // Ground star
    if (s.groundStar.available) {
      const bob = Math.sin(s.time * 4) * 4;
      drawEmoji(ctx, '⭐', s.groundStar.x, s.groundStar.y + bob, 28);
      drawText(ctx, 'اضغط E', s.groundStar.x, s.groundStar.y - 20, 12, '#FFD700', 'center', false);
    }

    // Thrown stars
    for (const star of s.stars) drawEmoji(ctx, '⭐', star.x, star.y, 20);

    // Instruction
    if (!s.player.carrying) {
      drawText(ctx, 'خذ النجمة واضغط E لرميها!', W / 2, H - 20, 14, '#FFD700', 'center', false);
    } else {
      drawText(ctx, 'اضغط E لرمي النجمة! 🎯', W / 2, H - 20, 14, '#FFD700', 'center', false);
    }

    s.player.render(ctx);
  }
}


// ═══════ src/stateManager.js ═══════
// stateManager.js — Game state machine
// States: MENU | LEVEL_SELECT | PLAYING | PAUSED | LEVEL_WIN | LEVEL_FAIL | GAME_COMPLETE


const STATE = {
  MENU:           'MENU',
  LEVEL_SELECT:   'LEVEL_SELECT',
  PLAYING:        'PLAYING',
  PAUSED:         'PAUSED',
  LEVEL_WIN:      'LEVEL_WIN',
  LEVEL_FAIL:     'LEVEL_FAIL',
  GAME_COMPLETE:  'GAME_COMPLETE',
};

class StateManager {
  constructor(game) {
    this.game = game;
    this.current = null;
    this.currentLevelId = 1;
    this.selectZone = 0;         // level-select page (0-5)

    // Transition flash
    this._flashAlpha = 0;
    this._flashDir   = 0;

    // Win/fail timer (auto-advance)
    this._panelTimer = 0;
    this._panelDelay = 0.5;   // brief pause before showing panel

    // UI buttons registered by UISystem each frame
    // (cleared + repopulated every render pass)
  }

  // ── Current state query ──────────────────────────────
  is(s) { return this.current === s; }

  // ── Transition to a new state ────────────────────────
  setState(newState) {
    this.current = newState;
    this._panelTimer = 0;

    switch (newState) {
      case STATE.MENU:
        this.game.levelManager.unloadLevel();
        this.game.audio.restartMusic();
        break;

      case STATE.PLAYING: {
        const lv = getLevelById(this.currentLevelId);
        if (!lv) { this.setState(STATE.MENU); return; }
        this.game.levelManager.loadLevel(lv);
        break;
      }

      case STATE.LEVEL_WIN: {
        // Award star + unlock next
        this.game.save.awardStar(this.currentLevelId);
        const nextId = this.currentLevelId + 1;
        if (nextId <= TOTAL_LEVELS) this.game.save.unlockLevel(nextId);
        break;
      }

      case STATE.GAME_COMPLETE:
        this.game.audio.stopMusic();
        break;
    }
  }

  // ── Update ────────────────────────────────────────────
  update(dt) {
    // Flash fade
    if (this._flashAlpha > 0) this._flashAlpha = Math.max(0, this._flashAlpha - dt * 3);

    // ESC → pause / unpause
    if (this.game.input.pressed('Escape')) {
      if (this.is(STATE.PLAYING)) { this.setState(STATE.PAUSED); return; }
      if (this.is(STATE.PAUSED))  { this.setState(STATE.PLAYING); return; }
    }

    switch (this.current) {
      case STATE.PLAYING:
        this._updatePlaying(dt);
        break;

      case STATE.LEVEL_WIN:
      case STATE.LEVEL_FAIL:
        this._panelTimer += dt;
        break;

      case STATE.PAUSED:
        // Check pause-panel clicks (handled via UI buttons in render)
        break;
    }
  }

  _updatePlaying(dt) {
    const lm = this.game.levelManager;

    // Intercept pause button click BEFORE level mechanics consume clicks
    const rawClicks = this.game.input.consumeClicks();
    let pauseClicked = false;
    for (const c of rawClicks) {
      if (c.x > 756 && c.x < 800 && c.y > 0 && c.y < 48) {
        pauseClicked = true;
      } else {
        this.game.input.clicks.push(c); // return non-pause clicks for level use
      }
    }
    if (pauseClicked) {
      this.setState(STATE.PAUSED);
      this.game.audio.sfxClick();
      return;
    }

    lm.update(dt);

    // Discard any unconsumed clicks (prevents phantom presses on win/fail panels)
    this.game.input.clicks.length = 0;

    // Check won / failed
    if (lm.isWon()) {
      this._panelTimer += dt; // accumulate during brief celebration
      if (this._panelTimer > this._panelDelay) {
        this._flashAlpha = 0.8;
        if (this.currentLevelId >= TOTAL_LEVELS) {
          this.setState(STATE.GAME_COMPLETE);
        } else {
          this.setState(STATE.LEVEL_WIN);
        }
      }
    } else if (lm.isFailed()) {
      this._panelTimer += dt;
      if (this._panelTimer > this._panelDelay) {
        this.setState(STATE.LEVEL_FAIL);
      }
    }
  }

  // ── Render ────────────────────────────────────────────
  render(ctx) {
    // Clear the UI button registry each frame
    this.game._uiButtons = [];

    const ui  = this.game.ui;
    const sv  = this.game.save;
    const lm  = this.game.levelManager;

    switch (this.current) {
      case STATE.MENU:
        ui.drawMenu(ctx, sv,
          () => this._startFromBeginning(),
          () => { this.setState(STATE.LEVEL_SELECT); this.game.audio.sfxClick(); },
          () => { this._toggleSound(); },
          () => { this._confirmReset(); }
        );
        break;

      case STATE.LEVEL_SELECT:
        ui.drawLevelSelect(ctx, sv, this.selectZone,
          (val) => {
            if (val === -1)  { this.selectZone = Math.max(0, this.selectZone - 1); this.game.audio.sfxClick(); }
            else if (val === 6) { this.selectZone = Math.min(5, this.selectZone + 1); this.game.audio.sfxClick(); }
            else if (sv.isUnlocked(val)) {
              this.currentLevelId = val;
              this.setState(STATE.PLAYING);
              this.game.audio.sfxClick();
            }
          },
          () => { this.setState(STATE.MENU); this.game.audio.sfxClick(); }
        );
        // Level tile clicks
        this._registerLevelTileClicks(ctx, sv);
        break;

      case STATE.PLAYING:
        lm.render(ctx);
        // HUD
        const lv = getLevelById(this.currentLevelId);
        const lmState = lm.state;
        ui.drawHUD(ctx,
          lv ? lv.name : '',
          lv ? lv.objective : '',
          sv.getTotalStars(),
          TOTAL_LEVELS,
          lmState ? lmState.timeLeft : null,
          () => this.setState(STATE.PAUSED)
        );
        break;

      case STATE.PAUSED:
        // Draw level underneath
        lm.render(ctx);
        const lvp = getLevelById(this.currentLevelId);
        if (lvp) ui.drawHUD(ctx, lvp.name, lvp.objective, sv.getTotalStars(), TOTAL_LEVELS, null, null);
        ui.drawPausePanel(ctx,
          () => { this.setState(STATE.PLAYING); this.game.audio.sfxClick(); },
          () => { this.setState(STATE.MENU);    this.game.audio.sfxClick(); }
        );
        break;

      case STATE.LEVEL_WIN:
        lm.render(ctx);
        ui.drawWinPanel(ctx, this.currentLevelId,
          () => { this._goNextLevel(); },
          () => { this.setState(STATE.MENU); this.game.audio.sfxClick(); }
        );
        break;

      case STATE.LEVEL_FAIL:
        lm.render(ctx);
        ui.drawFailPanel(ctx,
          () => { this.setState(STATE.PLAYING); this.game.audio.sfxClick(); },
          () => { this.setState(STATE.MENU);    this.game.audio.sfxClick(); }
        );
        break;

      case STATE.GAME_COMPLETE:
        ui.drawGameComplete(ctx, sv.getTotalStars(),
          () => { this.setState(STATE.MENU); this.game.audio.sfxClick(); }
        );
        break;
    }

    // Flash overlay
    if (this._flashAlpha > 0) ui.drawFlash(ctx, this._flashAlpha);
  }

  // ── Helpers ───────────────────────────────────────────

  _startFromBeginning() {
    this.game.audio.sfxClick();
    // Start from highest unlocked or level 1
    this.currentLevelId = this.game.save.data.highestUnlocked || 1;
    this.setState(STATE.PLAYING);
  }

  _goNextLevel() {
    this.game.audio.sfxClick();
    const next = this.currentLevelId + 1;
    if (next <= TOTAL_LEVELS) {
      this.currentLevelId = next;
      this.setState(STATE.PLAYING);
    } else {
      this.setState(STATE.GAME_COMPLETE);
    }
  }

  _toggleSound() {
    const sv = this.game.save;
    const newVal = !sv.getSoundOn();
    sv.setSoundOn(newVal);
    this.game.audio.setEnabled(newVal);
    if (newVal) this.game.audio.startMusic();
    this.game.audio.sfxClick();
  }

  _confirmReset() {
    // Simple inline confirm (no blocking popup)
    if (window.confirm('هل تريد إعادة تعيين كل التقدم؟')) {
      this.game.save.resetAll();
      this.game.audio.sfxClick();
    }
  }

  _registerLevelTileClicks(ctx, sv) {
    // Register click areas for the 5 level tiles on the current zone page
    const zone = this.selectZone;
    const startId = zone * 5 + 1;
    const positions = [
      { x: 60,  y: 90  }, { x: 220, y: 90  }, { x: 380, y: 90  },
      { x: 140, y: 220 }, { x: 300, y: 220 },
    ];
    for (let i = 0; i < 5; i++) {
      const levelId = startId + i;
      const pos = positions[i];
      const unlocked = sv.isUnlocked(levelId);
      if (unlocked) {
        const id = levelId; // capture
        this.game._uiButtons.push({
          x: pos.x, y: pos.y, w: 140, h: 110,
          cb: () => {
            this.currentLevelId = id;
            this.setState(STATE.PLAYING);
            this.game.audio.sfxClick();
          }
        });
      }
    }
  }
}


// ═══════ src/ui.js ═══════
// ui.js — All menus, HUD, overlays drawn on canvas


const ZONE_NAMES = [
  'قرية الفوضى',
  'غابة المقالب',
  'مدينة الروبوتات',
  'مهرجان الطعام',
  'قلعة الضحك',
  'النهاية الكبرى',
];

const ZONE_COLORS = [
  '#4CAF50', '#2E7D32', '#607D8B', '#FF9800', '#7B1FA2', '#B71C1C',
];

class UISystem {
  constructor(game) {
    this.game = game;
    this.W = game.W;
    this.H = game.H;
    // Hover state for buttons
    this._hover = {};
  }

  // ── Main Menu ─────────────────────────────────────────
  drawMenu(ctx, save, onPlay, onLevelSelect, onToggleSound, onReset) {
    const W = this.W, H = this.H;

    // Sky gradient background
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0D47A1');
    grad.addColorStop(1, '#1565C0');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Clouds
    drawCloud(ctx, 80,  60, 1.2);
    drawCloud(ctx, 300, 40, 0.9);
    drawCloud(ctx, 600, 70, 1.1);
    drawCloud(ctx, 700, 30, 0.7);

    // Island platform
    ctx.fillStyle = '#4CAF50';
    roundRectPath(ctx, 150, H - 130, W - 300, 90, 40);
    ctx.fill();
    ctx.fillStyle = '#388E3C';
    ctx.beginPath(); ctx.ellipse(W / 2, H - 100, 260, 30, 0, 0, Math.PI * 2); ctx.fill();

    // Title banner
    fillRoundRect(ctx, W / 2 - 270, 40, 540, 100, 20, 'rgba(0,0,0,0.55)');
    drawText(ctx, 'جزيرة المقالب', W / 2, 80, 42, '#FFD700', 'center');
    drawText(ctx, 'Prank Island', W / 2, 120, 22, '#FFF9C4', 'center');

    // Total stars
    const stars = save.getTotalStars();
    drawText(ctx, `⭐ ${stars} / 30`, W / 2, 155, 20, '#FFD700', 'center', false);

    // Buttons
    const bw = 220, bh = 52, bx = W / 2 - bw / 2;
    this._btn(ctx, bx, 185, bw, bh, '▶  العب الآن', '#E91E63', '#fff', onPlay);
    this._btn(ctx, bx, 248, bw, bh, '🗺  اختار المستوى', '#1976D2', '#fff', onLevelSelect);

    // Sound toggle
    const soundLabel = save.getSoundOn() ? '🔊  الصوت: شغال' : '🔇  الصوت: مطفي';
    this._btn(ctx, bx, 311, bw, bh, soundLabel, '#00796B', '#fff', onToggleSound);

    // Reset
    this._btn(ctx, bx, 374, bw, bh, '🔄  إعادة تعيين', '#616161', '#fff', onReset);

    // Decorative emoji NPCs on island
    const npcs = ['🐔','🐒','🤖','👨‍🍳','🐝'];
    npcs.forEach((e, i) => drawEmoji(ctx, e, 170 + i * 100, H - 102, 36));
  }

  // ── Level Select Screen ───────────────────────────────
  drawLevelSelect(ctx, save, currentPage, onLevelClick, onBack) {
    const W = this.W, H = this.H;

    // Background
    ctx.fillStyle = '#1A237E';
    ctx.fillRect(0, 0, W, H);
    fillRoundRect(ctx, 0, 0, W, 60, 0, 'rgba(0,0,0,0.4)');
    drawText(ctx, 'اختار المستوى', W / 2, 30, 26, '#FFD700', 'center');

    // Zone info (show zone name for page)
    const zone = currentPage; // 0-5
    const zoneName = ZONE_NAMES[zone] || '';
    const zoneColor = ZONE_COLORS[zone] || '#4CAF50';
    drawText(ctx, `المنطقة ${zone + 1}: ${zoneName}`, W / 2, 58, 18, zoneColor, 'center', false);

    // 5 level buttons per zone, 2 rows
    const startId = zone * 5 + 1;
    const positions = [
      { x: 60,  y: 90  }, { x: 220, y: 90  }, { x: 380, y: 90  },
      { x: 140, y: 220 }, { x: 300, y: 220 },
    ];

    for (let i = 0; i < 5; i++) {
      const levelId = startId + i;
      const pos = positions[i];
      const unlocked = save.isUnlocked(levelId);
      const hasStar  = save.hasStar(levelId);
      const color = unlocked ? zoneColor : '#424242';

      fillRoundRect(ctx, pos.x, pos.y, 140, 110, 16, color);
      strokeRoundRect(ctx, pos.x, pos.y, 140, 110, 16, 'rgba(255,255,255,0.3)', 3);

      if (unlocked) {
        drawText(ctx, `${levelId}`, pos.x + 70, pos.y + 38, 28, '#fff', 'center', false);
        // Short name below
        if (onLevelClick) {
          // Level name will be set by caller via LEVEL_DATA lookup
        }
        if (hasStar) drawStar(ctx, pos.x + 70, pos.y + 80, 14, '#FFD700');
        else { ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1.5; drawStar(ctx, pos.x + 70, pos.y + 80, 14, 'rgba(255,255,255,0.15)'); }
      } else {
        drawEmoji(ctx, '🔒', pos.x + 70, pos.y + 55, 32);
      }
    }

    // Zone nav arrows
    if (zone > 0) this._btn(ctx, 10, H / 2 - 25, 50, 50, '◀', '#333', '#fff', () => onLevelClick(-1));
    if (zone < 5) this._btn(ctx, W - 60, H / 2 - 25, 50, 50, '▶', '#333', '#fff', () => onLevelClick(6));

    // Pagination dots
    for (let z = 0; z < 6; z++) {
      ctx.fillStyle = z === zone ? '#FFD700' : 'rgba(255,255,255,0.3)';
      ctx.beginPath(); ctx.arc(W / 2 - 75 + z * 30, H - 40, 8, 0, Math.PI * 2); ctx.fill();
    }

    // Zone preview image (emoji row)
    const zoneEmojis = [
      ['🏘️','🌽','🎪','🥕','🏆'],
      ['🌳','🐒','🐸','🐝','🏠'],
      ['🤖','⚡','🔧','🔊','🔩'],
      ['🍔','🥣','👨‍🍳','🍦','🥄'],
      ['🏰','👻','🪑','🖼️','🟩'],
      ['😄','🎈','🌀','⚙️','👑'],
    ];
    (zoneEmojis[zone] || []).forEach((e, i) => drawEmoji(ctx, e, 530 + (i % 3) * 70, 120 + Math.floor(i / 3) * 80, 38));

    this._btn(ctx, W - 110, H - 55, 100, 44, '◀ رجوع', '#E91E63', '#fff', onBack);
  }

  // ── HUD (in-game) ─────────────────────────────────────
  drawHUD(ctx, levelName, objective, stars, totalStars, timeLeft, onPause) {
    const W = this.W;

    // Top bar
    fillRoundRect(ctx, 0, 0, W, 48, 0, 'rgba(0,0,0,0.55)');

    // Level name
    drawText(ctx, levelName, 10, 24, 15, '#FFD700', 'left', false);

    // Objective
    drawText(ctx, objective, W / 2, 24, 13, '#fff', 'center', false);

    // Stars
    drawText(ctx, `⭐ ${stars}/30`, W - 110, 24, 15, '#FFD700', 'left', false);

    // Timer
    if (timeLeft !== null && timeLeft !== undefined) {
      const col = timeLeft < 10 ? '#FF5252' : '#fff';
      drawText(ctx, `⏱ ${Math.ceil(timeLeft)}`, W - 55, 24, 15, col, 'right', false);
    }

    // Pause button
    fillRoundRect(ctx, W - 44, 6, 36, 36, 8, 'rgba(255,255,255,0.15)');
    drawText(ctx, '⏸', W - 26, 24, 18, '#fff', 'center', false);
  }

  // ── Win Panel ─────────────────────────────────────────
  drawWinPanel(ctx, levelId, onNext, onMenu) {
    const W = this.W, H = this.H;
    // Dim overlay
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, W, H);

    // Panel
    fillRoundRect(ctx, W / 2 - 200, H / 2 - 160, 400, 320, 24, '#1B5E20');
    strokeRoundRect(ctx, W / 2 - 200, H / 2 - 160, 400, 320, 24, '#FFD700', 4);

    drawText(ctx, '🎉 أحسنت! 🎉', W / 2, H / 2 - 110, 34, '#FFD700', 'center', false);
    drawText(ctx, 'نجمة جديدة!', W / 2, H / 2 - 65, 22, '#fff', 'center', false);
    drawStar(ctx, W / 2, H / 2 - 15, 38, '#FFD700');

    this._btn(ctx, W / 2 - 165, H / 2 + 50, 150, 52, '▶ التالي', '#E91E63', '#fff', onNext);
    this._btn(ctx, W / 2 + 15,  H / 2 + 50, 150, 52, '🏠 القائمة', '#1976D2', '#fff', onMenu);
  }

  // ── Fail Panel ────────────────────────────────────────
  drawFailPanel(ctx, onRetry, onMenu) {
    const W = this.W, H = this.H;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);

    fillRoundRect(ctx, W / 2 - 200, H / 2 - 130, 400, 260, 24, '#B71C1C');
    strokeRoundRect(ctx, W / 2 - 200, H / 2 - 130, 400, 260, 24, '#FF5252', 4);

    drawText(ctx, '😅 حاول مرة ثانية!', W / 2, H / 2 - 80, 30, '#fff', 'center', false);
    drawEmoji(ctx, '😂', W / 2, H / 2 - 20, 48);

    this._btn(ctx, W / 2 - 165, H / 2 + 50, 150, 52, '🔄 إعادة', '#FF6F00', '#fff', onRetry);
    this._btn(ctx, W / 2 + 15,  H / 2 + 50, 150, 52, '🏠 القائمة', '#616161', '#fff', onMenu);
  }

  // ── Pause Panel ───────────────────────────────────────
  drawPausePanel(ctx, onResume, onMenu) {
    const W = this.W, H = this.H;
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0, 0, W, H);

    fillRoundRect(ctx, W / 2 - 160, H / 2 - 130, 320, 260, 24, '#263238');
    strokeRoundRect(ctx, W / 2 - 160, H / 2 - 130, 320, 260, 24, '#78909C', 3);

    drawText(ctx, '⏸ إيقاف مؤقت', W / 2, H / 2 - 80, 28, '#fff', 'center', false);

    this._btn(ctx, W / 2 - 120, H / 2 - 30, 240, 52, '▶ استمر', '#2E7D32', '#fff', onResume);
    this._btn(ctx, W / 2 - 120, H / 2 + 38, 240, 52, '🏠 القائمة الرئيسية', '#616161', '#fff', onMenu);
  }

  // ── Game Complete Screen ──────────────────────────────
  drawGameComplete(ctx, totalStars, onMenu) {
    const W = this.W, H = this.H;

    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#4A148C');
    grad.addColorStop(1, '#880E4F');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    drawText(ctx, '🎊 انتهت اللعبة! 🎊', W / 2, 90, 36, '#FFD700', 'center');
    drawText(ctx, 'أنهيت جزيرة المقالب!', W / 2, 140, 22, '#fff', 'center', false);
    drawText(ctx, 'الملك فرفوش هُزم بالضحك!', W / 2, 175, 18, '#FFD700', 'center', false);

    // Star display
    drawText(ctx, `⭐ ${totalStars} / 30 نجمة`, W / 2, 230, 28, '#FFD700', 'center');

    // Stars row
    for (let i = 0; i < 30; i++) {
      const col = i < totalStars ? '#FFD700' : 'rgba(255,255,255,0.2)';
      drawStar(ctx, 80 + (i % 10) * 66, 290 + Math.floor(i / 10) * 50, 16, col);
    }

    drawEmoji(ctx, '👑', W / 2, 390, 52);

    this._btn(ctx, W / 2 - 120, H - 75, 240, 52, '🏠 القائمة الرئيسية', '#E91E63', '#fff', onMenu);
  }

  // ── Loading screen ────────────────────────────────────
  drawLoading(ctx) {
    const W = this.W, H = this.H;
    ctx.fillStyle = '#0D0020';
    ctx.fillRect(0, 0, W, H);
    drawText(ctx, 'جاري التحميل...', W / 2, H / 2, 28, '#FFD700', 'center');
  }

  // ── Transition flash ──────────────────────────────────
  drawFlash(ctx, alpha) {
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fillRect(0, 0, this.W, this.H);
  }

  // ── Countdown overlay ─────────────────────────────────
  drawCountdown(ctx, n) {
    const W = this.W, H = this.H;
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(0, 0, W, H);
    drawText(ctx, String(n), W / 2, H / 2, 96, '#FFD700', 'center');
  }

  // ── Simple helper: draw a clickable button + track hover ──
  _btn(ctx, x, y, w, h, label, bg, fg, cb) {
    const mx = this.game.input ? this.game.input.mouseX : -1;
    const my = this.game.input ? this.game.input.mouseY : -1;
    const hover = mx >= x && mx <= x + w && my >= y && my <= y + h;
    drawButton(ctx, x, y, w, h, label, bg, fg, hover);
    // Register as clickable for click-consume logic
    this.game._uiButtons.push({ x, y, w, h, cb });
  }

  // ── Zone level name lookup (called from level select) ─────
  getLevelShortName(id) {
    const names = [
      '', 'الدجاجة السارقة','الأحذية الطايرة','وش المهرج','قفز الطين','عربة البطيخ',
      'القرد والنظارات','الضفدع المغني','النحلة الزعلانة','البيت المقلوب','شلال الفقاعات',
      'الروبوت الكسول','الزر الخاطئ','مصنع الصوت','المكنسة المجنونة','وش الروبوت',
      'البرجر الهارب','فوضى الشوربة','الطباخ الغاضب','سباق الآيس كريم','الملعقة الذهبية',
      'قاعة المرايا','الأشباح الخايفة','الكرسي المقلب','لوحات الملك','الأرضية المتحركة',
      'اختبار الضحك','صيد البالونات','جري الفخاخ','آلة الفوضى','الملك فرفوش',
    ];
    return names[id] || `المستوى ${id}`;
  }
}


// ═══════ src/game.js ═══════
// game.js — Main Game class: bootstraps all systems, runs the loop







class Game {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx    = canvas.getContext('2d');
    this.W = canvas.width;   // 800
    this.H = canvas.height;  // 500

    // Systems (initialized in init())
    this.save         = null;
    this.audio        = null;
    this.input        = null;
    this.ui           = null;
    this.levelManager = null;
    this.state        = null;

    // UI button registry — rebuilt every render frame
    this._uiButtons = [];

    // Loop
    this._running  = false;
    this._lastTime = 0;
    this._boundLoop = this._loop.bind(this);
    this._musicStarted = false;
  }

  // ── Bootstrap ─────────────────────────────────────────
  init() {
    // 1. Pure-data systems (no DOM needed)
    this.save  = new SaveSystem();
    this.audio = new AudioSystem();
    this.audio.setEnabled(this.save.getSoundOn());

    // 2. Input (needs canvas)
    this.input = new InputSystem(this.canvas);

    // 3. UI (needs game reference for button hit-testing)
    this.ui = new UISystem(this);

    // 4. Level & state managers
    this.levelManager = new LevelManager(this);
    this.state        = new StateManager(this);

    // 5. Click routing: canvas click → UISystem button list
    this.canvas.addEventListener('click', (e) => {
      this._handleClick(e);
    });
    this.canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      this._handleTouchEnd(e);
    }, { passive: false });

    // 6. First user-gesture → start audio
    const startAudio = () => {
      if (!this._musicStarted) {
        this._musicStarted = true;
        if (this.save.getSoundOn()) this.audio.startMusic();
        // Remove after first interaction
        window.removeEventListener('keydown', startAudio);
        window.removeEventListener('click',   startAudio);
        window.removeEventListener('touchstart', startAudio);
      }
    };
    window.addEventListener('keydown',   startAudio, { once: true });
    window.addEventListener('click',     startAudio, { once: true });
    window.addEventListener('touchstart',startAudio, { once: true });

    // 7. Start state machine
    this.state.setState(STATE.MENU);

    // 8. Game loop
    this._running  = true;
    this._lastTime = performance.now();
    requestAnimationFrame(this._boundLoop);
  }

  // ── Main loop ─────────────────────────────────────────
  _loop(timestamp) {
    if (!this._running) return;

    // Delta time — capped to 100ms to prevent physics explosions on tab-switch
    const rawDt = (timestamp - this._lastTime) / 1000;
    const dt = Math.min(rawDt, 0.1);
    this._lastTime = timestamp;

    this._update(dt);
    this._render();

    // Clear per-frame input state AFTER everything processed
    this.input.endFrame();

    requestAnimationFrame(this._boundLoop);
  }

  _update(dt) {
    this.state.update(dt);
  }

  _render() {
    const ctx = this.ctx;
    // Clear
    ctx.clearRect(0, 0, this.W, this.H);
    // Delegate to state machine
    this.state.render(ctx);
  }

  // ── Click routing ─────────────────────────────────────
  _handleClick(e) {
    const r   = this.canvas.getBoundingClientRect();
    const scX = this.W / r.width;
    const scY = this.H / r.height;
    const x   = (e.clientX - r.left) * scX;
    const y   = (e.clientY - r.top)  * scY;
    this._dispatchUIClick(x, y);
  }

  _handleTouchEnd(e) {
    const r   = this.canvas.getBoundingClientRect();
    const scX = this.W / r.width;
    const scY = this.H / r.height;
    for (const t of e.changedTouches) {
      const x = (t.clientX - r.left) * scX;
      const y = (t.clientY - r.top)  * scY;
      this._dispatchUIClick(x, y);
    }
  }

  /**
   * Walk the _uiButtons list (populated each frame during render)
   * and fire the first matching button's callback.
   */
  _dispatchUIClick(x, y) {
    for (const btn of this._uiButtons) {
      if (x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
        if (typeof btn.cb === 'function') btn.cb();
        break; // only fire first hit
      }
    }
  }

  // ── Cleanup ───────────────────────────────────────────
  destroy() {
    this._running = false;
    this.input.destroy();
    this.audio.stopMusic();
  }
}


// ═══════ main.js ═══════
// main.js — Entry point

window.addEventListener('DOMContentLoaded', () => {
  const canvas = document.getElementById('game-canvas');
  const game = new Game(canvas);
  game.init();
  // Expose for debugging in dev console
  window._game = game;
});
